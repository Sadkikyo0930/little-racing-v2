name: Package lighthouse-grandpa original GLB for Mixamo
on:
  push:
    branches:
      - asset/lighthouse-grandpa-mixamo-package-20261115
    paths:
      - .github/workflows/package-lighthouse-grandpa-mixamo.yml
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and package original asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _lighthouse_mixamo_package docs/downloads
          cp docs/assets/lighthouse-grandpa-Bfj9bp4N.glb _lighthouse_mixamo_package/lighthouse-grandpa-original.glb
          test "$(stat -c%s _lighthouse_mixamo_package/lighthouse-grandpa-original.glb)" -eq 541804
          printf '%s\n' \
            'Lighthouse Grandpa Original GLB for Mixamo' \
            'Source: Sadkikyo0930/little-racing-v2' \
            'Path: docs/assets/lighthouse-grandpa-Bfj9bp4N.glb' \
            'Git blob SHA: 310edbaabb68a2c4fcca5cc263974ab629c077e5' \
            'Size: 541804 bytes.' \
            'This GLB is copied unchanged. No rig or animation applied.' \
            'For Mixamo use Blender to inspect and export FBX.' \
            'Test upload, auto-rig, walk and wave on a copy.' \
            'Do not overwrite the production GLB or deploy the test.' \
            > _lighthouse_mixamo_package/README.txt
          (cd _lighthouse_mixamo_package && zip -9 -q ../docs/downloads/lighthouse-grandpa-mixamo-test.zip lighthouse-grandpa-original.glb README.txt)
          unzip -t docs/downloads/lighthouse-grandpa-mixamo-test.zip
          sha256sum _lighthouse_mixamo_package/lighthouse-grandpa-original.glb docs/downloads/lighthouse-grandpa-mixamo-test.zip
      - name: Commit download package only to dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/lighthouse-grandpa-mixamo-test.zip
          git commit -m "assets: package untouched lighthouse grandpa GLB for Mixamo test"
          git push origin HEAD:asset/lighthouse-grandpa-mixamo-package-20261115
