    <style>
      #ae86Lobby {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));

        transition: opacity 0.32s ease, visibility 0.32s ease;
      }
      #ae86Lobby.hide {

      }
      #ae86Lobby .ldCard {

        background: linear-gradient(180deg, #ffffff 0%, #f2f6fc 100%);

      }
      #ae86Lobby .ldKicker {

        font-weight: 800;
        letter-spacing: 0.14em;
        color: #e23b2e;
        text-transform: uppercase;
      }
      #ae86Lobby h1 {
        margin: 0 0 10px;
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: 0.02em;
      }
      #ae86Lobby .ldSub {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.7;
        color: #5b7290;
      }
      #ae86Lobby .ldBtn {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 16px 14px;
        font-size: 17px;
        font-weight: 800;
        font-family: inherit;
        cursor: pointer;
        margin-bottom: 10px;
        -webkit-appearance: none;
      }
      #ae86Lobby .ldBtn.primary {
        background: #e23b2e;
        color: #fff;
        box-shadow: 0 10px 24px rgba(226, 59, 46, 0.34);
      }
      #ae86Lobby .ldBtn.ghost {
        background: #e7eef8;
        color: #12243d;
      }
      #ae86Lobby .ldBtn:active {
        transform: scale(0.985);
      }
      #ae86Lobby .ldHint {
        margin: 12px 0 0;
        font-size: 12.5px;
        color: #8aa0ba;
        min-height: 18px;
      }
      #ae86Lobby .ldHint.ready {
        color: #2fae6a;
        font-weight: 700;
      }
      #ae86DemoTag {
        position: fixed;
        left: 10px;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        z-index: 2147482999;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(8, 20, 38, 0.72);
        color: #cfe1f6;
        font: 700 11px/1 -apple-system, "PingFang SC", sans-serif;
        letter-spacing: 0.04em;
        pointer-events: none;

      #ae86DemoTag.hide {

    <!--
      AE86 独立试玩版入口（只在隔离测试部署里存在，绝不进 docs/，不进正式站点）。

      与正式 index.html 的区别只有一件事：这里不加载 r5/race-guard.mjs，
      所以没有设备绑定、没有家长三账号、没有 V6 学习通行证、没有 1800 秒额度。
      存档被整体改名到 ae86demo:: 前缀下，与正式家庭存档（lrv2.*）互不可见，
      而且本页加载的 index-ae86demo.js 里 family sync / birthday claim 都被换成空实现，
      不会向 CloudBase 发送任何请求。
    -->
    <script>
      (function () {
        'use strict';

        /* ---------- 1. 独立存档命名空间 ---------- */
        var NS = 'ae86demo::';
        var nativeStore = null;
        try { nativeStore = window.localStorage; } catch (e) { nativeStore = null; }
        var mem = Object.create(null);

        function namespacedKeys() {
          var out = [], i, k;
          if (!nativeStore) { for (k in mem) out.push(k); return out; }
          try {
            for (i = 0; i < nativeStore.length; i++) {
              k = nativeStore.key(i);
              if (k && k.indexOf(NS) === 0) out.push(k.slice(NS.length));
            }
          } catch (e) { /* 隐私模式下读不到就退回内存 */ }
          return out;
        }

        var Store = {
          getItem: function (k) {
            k = String(k);
            if (!nativeStore) return k in mem ? mem[k] : null;
            try { return nativeStore.getItem(NS + k); } catch (e) { return k in mem ? mem[k] : null; }
          },
          setItem: function (k, v) {
            k = String(k); v = String(v);
            if (nativeStore) { try { nativeStore.setItem(NS + k, v); return; } catch (e) { /* 配额满就落内存 */ } }
            mem[k] = v;
          },
          removeItem: function (k) {
            k = String(k);
            if (nativeStore) { try { nativeStore.removeItem(NS + k); } catch (e) {} }
            delete mem[k];
          },
          clear: function () {
            namespacedKeys().forEach(function (k) { Store.removeItem(k); });
            for (var k in mem) delete mem[k];
          },
          key: function (i) {
            var a = namespacedKeys();
            return i >= 0 && i < a.length ? a[i] : null;
          }
        };
        try {
          Object.defineProperty(Store, 'length', { get: function () { return namespacedKeys().length; }, configurable: true });
        } catch (e) { Store.length = 0; }

        window.__AE86_DEMO_STORAGE__ = Store;
        // 只读暴露原始存储，供验收脚本核对「本域里没有任何 lrv2.* 正式键」。
        window.__AE86_DEMO_RAW__ = nativeStore;
        window.__AE86_DEMO_RAW_LRV2_KEYS__ = function () {
          var out = [];
          if (!nativeStore) return out;
          try {
            for (var i = 0; i < nativeStore.length; i++) {
              var k = nativeStore.key(i);
              if (k && k.indexOf('lrv2.') === 0) out.push(k);
            }
          } catch (e) { /* ignore */ }
          return out;
        };

        // 让游戏里那些直接写 globalThis.localStorage 的零散开关（音量、语音、章节状态）
        // 也落到同一命名空间，不在本域留下任何 lrv2.* 正式键。
        var storageIsolated = false;
        try {
          Object.defineProperty(window, 'localStorage', {
            configurable: true,
            enumerable: true,
            get: function () { return Store; }
          });
          storageIsolated = window.localStorage === Store;
        } catch (e) { storageIsolated = false; }

        /* ---------- 2. 预置试玩存档：AE86 直接解锁 ---------- */
        var now = Date.now();
        var OWNED = { red: true, turtle: true, moto: true, frag_common: true, frag_rare: true, scholar: true };

        function seed(key, value) {
          if (Store.getItem(key) === null) Store.setItem(key, JSON.stringify(value));
        }

        seed('lrv2.garage.meta', { version: 4, createdAt: now, migratedAt: now });
        seed('lrv2.garage.coins', { coins: 99999, appliedRewards: [], updatedAt: now });
        seed('lrv2.garage.tx', []);
        seed('lrv2.garage.owned', OWNED);
        seed('lrv2.garage.current', { vehicle: 'frag_rare', updatedAt: now });
        seed('lrv2.garage.story', {
          chapter1: { granted: true, at: now, vehicleId: 'turtle', migrated: true }
        });
        seed('lrv2.garage.study', {});
        seed('lrv2.garage.claims', []);
        seed('lrv2.garage.achievements', {});
        seed('lrv2.vehicle', 'frag_rare');

        // 无论上一次试玩怎么改，AE86 在试玩里永远可用。
        try {
          var owned = JSON.parse(Store.getItem('lrv2.garage.owned') || '{}');
          if (!owned || typeof owned !== 'object') owned = {};
          owned.frag_rare = true;
          Store.setItem('lrv2.garage.owned', JSON.stringify(owned));
        } catch (e) { /* ignore */ }

        /* ---------- 3. 大厅 ---------- */
        var demo = {
          version: '1.0.0',
          namespace: NS,
          storageIsolated: storageIsolated,
          seeded: true,
          lobby: 'visible',
          action: null,
          menuReady: false,
          garageOpened: false,
          raceStarted: false
        };
        window.__AE86_DEMO__ = demo;

        function waitFor(selector, timeoutMs) {
          return new Promise(function (resolve) {
            var started = Date.now();
            (function tick() {
              var el = document.querySelector(selector);
              if (el) return resolve(el);
              if (Date.now() - started > timeoutMs) return resolve(null);
              setTimeout(tick, 150);
            })();
          });
        }

        window.__AE86_DEMO_WAIT__ = waitFor;

        document.addEventListener('DOMContentLoaded', function () {
          var lobby = document.getElementById('ae86Lobby');
          var tag = document.getElementById('ae86DemoTag');
          var hint = document.getElementById('ldHint');

          function hideLobby() {
            lobby.classList.add('hide');
            demo.lobby = 'hidden';
            if (tag) tag.classList.remove('hide');
          }

          function enterGarage() {
            demo.action = 'garage';
            hideLobby();
            waitFor('#garageBtn', 60000).then(function (btn) {
              if (btn) {
                btn.click();
                demo.garageOpened = true;
              } else {
                var play = document.querySelector('#playBtn');
                if (play) play.click();
              }
            });
          }

          function startRace() {
            demo.action = 'race';
            hideLobby();
            waitFor('#playBtn', 60000).then(function (btn) {
              if (btn) {
                btn.click();
                demo.raceStarted = true;
              }
            });
          }

          var g = document.getElementById('ldGarage');
          var r = document.getElementById('ldRace');
          if (g) g.addEventListener('click', enterGarage);
          if (r) r.addEventListener('click', startRace);

          // 菜单一出现就告诉用户可以点，避免「点了没反应」的错觉
          waitFor('#playBtn', 90000).then(function (btn) {
            if (!btn) {
              if (hint) hint.textContent = '赛道加载有点慢，请再点一次按钮试试';
              return;
            }
            demo.menuReady = true;
            if (hint && demo.lobby === 'visible') {
              hint.textContent = '赛道已就绪，点上面按钮出发';
              hint.classList.add('ready');
            }
          });
        });
      })();
    </script>
  </head>

    <!-- 试玩构建：由 tools/build-demo.mjs 从正式主包生成，
