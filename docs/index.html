<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070c" />
    <meta name="description" content="Little Racing V2 — a friendly, child-safe 3D kart racer. Based on Old San Juan Kart, built with Three.js." />
    <!-- Lets the game run chrome-free when added to an iOS home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Little Racing" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ed1c24'/%3E%3Crect y='6' width='32' height='5' fill='%23fff'/%3E%3Crect y='17' width='32' height='5' fill='%23fff'/%3E%3Cpath d='M0 0 18 16 0 32Z' fill='%230050f0'/%3E%3Cpath d='M6 16l1.6 4.6H12l-3.5 2.7 1.3 4.5L6 25l-3.8 2.8 1.3-4.5L0 20.6h4.4Z' fill='%23fff' transform='translate(1.5 -8) scale(0.75)'/%3E%3C/svg%3E" />
    <title>Little Racing V2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="ui"></div>
    </div>
    <!-- Static markup so it paints on first frame: the procedural world build
         is synchronous and takes several seconds on a phone. -->
    <div id="boot">
      <div class="bootInner">
        <svg class="bootFlag" viewBox="0 0 300 200" role="img" aria-label="Flag of Puerto Rico">
          <rect width="300" height="200" fill="#ed1c24" />
          <rect y="40" width="300" height="40" fill="#fff" />
          <rect y="120" width="300" height="40" fill="#fff" />
          <path d="M0 0 L0 200 L173.2 100 Z" fill="#0050a4" />
          <path
            fill="#fff"
            d="M57.7 66 L65.34 89.48 L90.04 89.49 L70.06 104.02 L77.69 127.51 L57.7 113 L37.71 127.51 L45.34 104.02 L25.36 89.49 L50.06 89.48 Z"
          />
        </svg>
        <div class="bootTitle">LITTLE RACING V2</div>
        <div class="bootBar"><i id="bootFill"></i></div>
        <div class="bootLabel" id="bootLabel">Warming up…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
