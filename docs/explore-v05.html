}

const gravelTex=speckleTex('#a9906d',['#c9b590','#8a7253','#ddcaa5','#6d5c43','#b39d79'],2100);

const plankTex=speckleTex('#b48a5c',['#c79d6e','#966f47','#d8b286','#7f5e3c'],620);

/* ==================== 1. 路线定义（V0.3 原样保留，不改动一条路线） ==================== */
const roads=[

{name:'乡村支线',kind:'asphalt',width:13,pts:[[-470,-880,1],[-690,-610,1],[-890,-450,1],[-1140,-420,1],[-1260,-150,1],[-1020,100,2],[-880,320,2]]},
{name:'湖畔碎石路',kind:'gravel',width:13,pts:[[-880,320,2],[-1020,480,3],[-1120,750,3],[-860,950,5],[-560,900,4],[-400,730,2],[-510,480,2],[-880,320,2]]},
{name:'森林与小镇联络线',kind:'asphalt',width:13,pts:[[-400,730,2],[-260,490,2],[-80,220,2],[80,-40,1],[50,-670,1]]},
{name:'盘山公路·上山',kind:'mountain',width:12,pts:[[80,-40,1],[240,170,4],[490,160,17],[750,260,44],[470,400,67],[290,530,89],[590,590,118],[980,630,153],[1060,800,187],[800,880,214],[540,980,238],[810,1130,272],[1100,1200,299],[1280,1150,320]]},
{name:'盘山公路·下山',kind:'mountain',width:12,pts:[[1280,1150,320],[1360,900,278],[1130,740,227],[1170,460,172],[920,350,120],[1080,70,61],[690,-100,18],[410,-860,2]]},
{name:'海岸风景线',kind:'asphalt',width:13,pts:[[-610,-1130,1],[-870,-1240,1],[-1140,-1160,1],[-1330,-940,1],[-1260,-730,1],[-1140,-420,1]]},
{name:'赛车场外圈',kind:'asphalt',width:16,pts:[[410,-860,2],[740,-760,2],[1050,-870,2],[1230,-1070,2],[980,-1260,2],[690,-1240,2],[410,-860,2]]},
{name:'山脚捷径',kind:'asphalt',width:11,pts:[[210,-1030,1],[480,-500,2],[690,-100,18]]},
{name:'穿林小路',kind:'gravel',width:10,pts:[[-1140,-420,1],[-780,-110,2],[-400,200,2],[-80,220,2]]}
];
/* ==================== 2. 隧道参数与轴线（与道路同一条曲线，采样边界对齐） ==================== */
const TUN_W=15,TUN_WALL=4.6,TUN_TOP=10.2,SHELL=3.2,DECK_LIFT=.11;
const TUNNEL_DEFS=[
 {road:'盘山公路·上山',a:7.08,b:7.78,name:'盘山主隧道',portal:'松云岭隧道',len:'1 280 m',exit:'valley'},
 {road:'乡村支线',a:3.24,b:3.77,name:'郊外秘密短隧道',portal:'萤火小径',len:'680 m',exit:'meadow'}
];
const METAS=roads.map(def=>({def,curve:new T.CatmullRomCurve3(def.pts.map(p=>new T.Vector3(p[0],p[2],p[1])),false,'centripetal',.4),n:0}));
METAS.forEach(m=>{m.n=Math.max(120,Math.ceil(m.curve.getLength()/16))});
const TUNNELS=TUNNEL_DEFS.map(td=>{
 const m=METAS.find(x=>x.def.name===td.road),seg=m.def.pts.length-1;
 const iA=Math.round(td.a/seg*m.n),iB=Math.round(td.b/seg*m.n),t0=iA/m.n,t1=iB/m.n;
 const rings=Math.max(18,Math.ceil((t1-t0)*m.curve.getLength()/6)),axis=[];
 for(let i=0;i<=rings;i++){
  const t=t0+(t1-t0)*i/rings,p=m.curve.getPoint(t),v=m.curve.getTangent(Math.min(t,.99999)),l=Math.hypot(v.x,v.z)||1;
  axis.push({x:p.x,z:p.z,y:p.y,nx:-v.z/l,nz:v.x/l,y0:p.y+DECK_LIFT,t});
 }
 return {...td,meta:m,iA,iB,t0,t1,rings,axis,W:TUN_W,wall:TUN_WALL,top:TUN_TOP};
});
function tunnelAt(x,z){
 let best=null;
 for(const t of TUNNELS)for(let k=0;k<t.axis.length;k++){
  const a=t.axis[k],dx=x-a.x,dz=z-a.z,d2=dx*dx+dz*dz;
  if(!best||d2<best.d2)best={t,k,d2,dx,dz,a};
 }
 if(!best||best.d2>3600)return null;
 const {t,k,dx,dz,a}=best;
 return {t,k,a,dist:Math.sqrt(best.d2),lat:dx*a.nx+dz*a.nz,along:dx*a.nz-dz*a.nx,y0:a.y0,W:t.W,top:t.top,inside:k>0&&k<t.axis.length-1};
}
function intrudesTunnel(x,y,z,r){
 for(const t of TUNNELS)for(let k=0;k<t.axis.length;k+=2){
  const a=t.axis[k],dx=x-a.x,dz=z-a.z,lat=Math.abs(dx*a.nx+dz*a.nz),along=Math.abs(dx*a.nz-dz*a.nx);
  if(along>r+9)continue;
  if(lat-r<t.W/2-.4&&y-r<a.y0+t.top-.4&&y+r>a.y0+.25)return true;
 }
 return false;
}
// 隧道净空盒：沿轴向 ±20m、横向 ±(W/2+16)、垂直洞底到洞顶各留余量。
// 用它裁掉所有山体坡面，避免任意一条盘山路的边坡横穿隧道（V0.3 的主要穿模源）。
function tunnelVolumeNear(x,z,y){
 for(const t of TUNNELS)for(let k=0;k<t.axis.length;k+=2){
  const a=t.axis[k],dx=x-a.x,dz=z-a.z;
  if(Math.abs(dx*a.nz-dz*a.nx)>26)continue;
  // 坡面三角形跨度可达上百米，垂直范围必须覆盖整块斜面，否则会残留穿洞的面
  if(Math.abs(dx*a.nx+dz*a.nz)<t.W/2+24&&y>a.y0-46&&y<a.y0+t.top+34)return true;

}
/* ==================== 3. 道路网格：隧道段挖空，湖畔路加真实多频起伏 ==================== */
const lines=[],roadSamples=[],AUDIT={obstacles:[],rejected:0,deckGaps:0};
function drawRoad(m){
 const {def,curve,n}=m,tun=TUNNELS.find(t=>t.meta===m),length=curve.getLength();
 const vertices=[],uvs=[],colors=[],indices=[],points=[],cum=[];
 const edgeRuns=[[],[]],openRuns=[[],[]],midPts=[];
 let runL=[],runR=[];
 const flush=()=>{if(runL.length>1)edgeRuns[0].push(runL);if(runR.length>1)edgeRuns[1].push(runR);runL=[];runR=[]};
 for(let i=0;i<=n;i++){
  const t=i/n,p=curve.getPoint(t),tan=curve.getTangent(Math.min(t,.99999));
  const nx=-tan.z,nz=tan.x,norm=Math.hypot(nx,nz)||1,ux=nx/norm,uz=nz/norm,half=def.width/2;
  const meters=t*length;
  if(def.kind==='gravel'){
   for(const center of [150,350,580,790]){const u=Math.abs(meters-center)/32;if(u<1)p.y+=4.2*Math.pow(1-u*u,2)}
   // 细碎不规则起伏：幅度远小于主驼峰，保留起跳落地的手感
   p.y+=.42*Math.sin(meters*.071)+.26*Math.sin(meters*.19+1.7)+.14*Math.sin(meters*.47+.5);
  }
  const wobble=def.kind==='gravel'?.34*Math.sin(meters*.13)+.18*Math.sin(meters*.31+2.2):0;

  const a=new T.Vector3(p.x+ux*(half+wobble),p.y+DECK_LIFT,p.z+uz*(half+wobble));
  const b=new T.Vector3(p.x-ux*(half+wobbleR),p.y+DECK_LIFT,p.z-uz*(half+wobbleR));
  vertices.push(a.x,a.y,a.z,b.x,b.y,b.z);
  const v=meters/9;uvs.push(0,v,1,v);
  if(def.kind==='gravel'){const s=.86+.14*Math.sin(meters*.23)+.07*Math.sin(meters*.71);colors.push(s,s*.98,s*.92,s*.94,s,s*.9)}
  points.push([p.x,p.z,p.y]);cum.push(meters);
  const skip=!!tun&&i>=tun.iA&&i<tun.iB;
  if(skip){flush();AUDIT.deckGaps++}else{
   if(i<n){const k=2*i;indices.push(k,k+1,k+2,k+1,k+3,k+2)}
   const ey=p.y+DECK_LIFT+.075;
   runL.push([[p.x+ux*(half-.05),ey,p.z+uz*(half-.05)],[p.x+ux*(half-.46),ey,p.z+uz*(half-.46)]]);
   runR.push([[p.x-ux*(half-.05),ey,p.z-uz*(half-.05)],[p.x-ux*(half-.46),ey,p.z-uz*(half-.46)]]);
   if(i%10<4){const ly=p.y+DECK_LIFT+.078;midPts.push(p.x-tan.x*3,ly,p.z-tan.z*3,p.x+tan.x*3,ly,p.z+tan.z*3)}
  }
  if(i%8===0)roadSamples.push([p.x,p.z,p.y]);
 }
 flush();
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vertices,3));
 g.setAttribute('uv',new T.Float32BufferAttribute(uvs,2));
 if(colors.length)g.setAttribute('color',new T.Float32BufferAttribute(colors,3));
 g.setIndex(indices);g.computeVertexNormals();
 const mesh=part(g,def.kind==='gravel'?gravelMat:roadMat,0,0,0);mesh.frustumCulled=false;
 lines.push({name:def.name,kind:def.kind,width:def.width,half:def.width/2,pts:points,cum});
 for(const runs of edgeRuns)for(const run of runs)ribbon(run,edgeMat,9);
 if(midPts.length){
  const mg=new T.BufferGeometry();mg.setAttribute('position',new T.Float32BufferAttribute(midPts,3));
  scene.add(new T.LineSegments(mg,new T.LineBasicMaterial({color:'#fff0bd',transparent:true,opacity:.85})));

}
METAS.forEach(drawRoad);
function closestRoad(x,z){
 let best={distance:Infinity,y:0,kind:'grass',name:'野外',half:0,bend:0,px:x,pz:z,m:0};
 for(const l of lines)for(let i=1;i<l.pts.length;i++){
  const a=l.pts[i-1],b=l.pts[i],vx=b[0]-a[0],vz=b[1]-a[1],len=vx*vx+vz*vz||1,cm0=l.cum[i-1],cm1=l.cum[i];
  const t=Math.max(0,Math.min(1,((x-a[0])*vx+(z-a[1])*vz)/len));
  const dis=Math.hypot(x-a[0]-t*vx,z-a[1]-t*vz);
  if(dis<best.distance){
   let bend=0;
   if(i>1&&i<l.pts.length-1){
    const p=l.pts[i-2],q=l.pts[i+1],v1x=a[0]-p[0],v1z=a[1]-p[1],v2x=q[0]-b[0],v2z=q[1]-b[1];
    const n1=Math.hypot(v1x,v1z)||1,n2=Math.hypot(v2x,v2z)||1;
    bend=Math.max(0,1-(v1x*v2x+v1z*v2z)/(n1*n2));
   }
   best={distance:dis,y:a[2]+t*(b[2]-a[2]),kind:l.kind,name:l.name,half:l.half,bend,px:a[0]+t*vx,pz:a[1]+t*vz,m:cm0+t*(cm1-cm0)};
  }
 }
 return best;
}
/* 统一刷点净空：路半宽 + 物体半径 + 直道/弯道/山地/越野余量，且不得侵入隧道净空 */
function clearance(x,z,y,r,margin=3){
 const c=closestRoad(x,z);
 const need=c.half+r+margin+(c.kind==='mountain'?4:0)+(c.kind==='gravel'?3:0)+c.bend*7;
 const vol=intrudesTunnel(x,y,z,r);
 const inWater=Math.hypot(x+800,z-655)<352+r;
 const ok=c.distance>=need&&!vol&&!inWater&&Math.abs(x)<1440&&Math.abs(z)<1440;

}
function place(x,z,y,r,kind,build,margin=3){

 return [a.x+a.nx*lat+a.nz*along,a.z+a.nz*lat-a.nx*along];
}
function drive(dt){
 const before=closestRoad(state.x,state.z);
 const accel=buttons.gas?17:0,brake=buttons.brake?26:0;
 state.speed=Math.max(-10,Math.min(30,state.speed+dt*(accel-brake)));
 if(!buttons.gas&&!buttons.brake)state.speed-=Math.sign(state.speed)*Math.min(Math.abs(state.speed),8*dt);
 state.steer=T.MathUtils.damp(state.steer,(buttons.left?1:0)-(buttons.right?1:0),7,dt);
 if(Math.abs(state.speed)>.3)state.heading-=state.steer*dt*(.55+Math.min(Math.abs(state.speed),22)*.023)*Math.sign(state.speed);
 let nx=state.x+Math.sin(state.heading)*state.speed*dt,nz=state.z-Math.cos(state.heading)*state.speed*dt;
 if(before.kind==='mountain'&&before.y>15&&before.distance<15){
  // 软护栏：把车推回路肩内而不是原地钉死，保证弯道与隧道口能连续通行
  const next=closestRoad(nx,nz);
  if(next.distance>8.5){
   const k=Math.min(1,8.5/next.distance);
   nx=next.px+(nx-next.px)*k;nz=next.pz+(nz-next.pz)*k;state.speed*=.72;
  }
 }
 // 隧道硬碰撞：对旧位置到新位置做扫掠，任何一步越界都钳回车道内
 const ti=tunnelAt(nx,nz);
 if(ti&&ti.inside){
  const fixed=clampIntoTunnel(nx,nz,ti);
  if(fixed){nx=fixed[0];nz=fixed[1];state.speed*=.72}
  const ti2=tunnelAt(nx,nz);if(ti2&&ti2.inside){
   const f2=clampIntoTunnel(nx,nz,ti2);if(f2){nx=f2[0];nz=f2[1]}
  }
 }
 if(Math.abs(nx)>=1450||Math.abs(nz)>=1450)state.speed=0;else{state.x=nx;state.z=nz}
 const surface=closestRoad(state.x,state.z);state.driveDistance+=Math.abs(state.speed*dt);
 if(surface.distance>15)state.speed*=Math.pow(.95,dt*60);
 const targetY=surface.distance<22?surface.y+1.2:Math.max(1.2,surface.y+1.2-(surface.distance-22)*.03);
 const lakeBump=surface.kind==='gravel'&&surface.distance<13;
 const delta=lakeBump&&state.previousGravelY!==null?targetY-state.previousGravelY:0;
 const inTunnelNow=!!(ti&&ti.inside&&Math.abs(ti.lat)<ti.W/2);
 const launch=()=>{state.airborne=true;state.verticalVelocity=4.1+Math.min(6,Math.abs(state.speed)*.25);state.wasClimbing=false;toast('🚙 飞跃土坡！')};
 if(lakeBump&&!state.airborne&&state.wasClimbing&&delta<-.12&&Math.abs(state.speed)>12)launch();
 if(lakeBump&&delta>.12)state.wasClimbing=true;
 if(!lakeBump)state.wasClimbing=false;
 state.previousGravelY=lakeBump?targetY:null;
 // V0.4：按路面弧长锁定四处主驼峰，高速通过必弹起一次，又不会因细碎起伏一直碎弹
 const crests=[150,350,580,790],m=surface.m;
 const onSlope=lakeBump&&crests.some(c=>m>c-34&&m<c-4);
 const afterCrest=lakeBump&&crests.some(c=>m>c+3&&m<c+32);
 if(onSlope)state.wasClimbing=true;
 if(afterCrest&&state.wasClimbing&&!state.airborne&&Math.abs(state.speed)>12)launch();
 if(inTunnelNow){state.airborne=false;state.verticalVelocity=0}
 if(state.airborne){
  state.y+=state.verticalVelocity*dt;state.verticalVelocity-=26*dt;
  if(state.verticalVelocity<0&&state.y<=targetY){state.y=targetY;state.airborne=false;state.verticalVelocity=0;state.landingCompression=1.1;toast('💥 落地！悬挂压缩回弹')}
 }else state.y=T.MathUtils.damp(state.y,targetY,lakeBump?18:7,dt);
 if(inTunnelNow)state.y=Math.min(state.y,ti.y0+ti.top-5.4);
 state.landingCompression=T.MathUtils.damp(state.landingCompression,0,8,dt);
 const bumpTarget=lakeBump&&!state.airborne?Math.min(.19,.045+Math.abs(state.speed)*.005)*Math.sin(state.driveDistance*2.8):0;
 state.shake=T.MathUtils.damp(state.shake,bumpTarget-state.landingCompression,12,dt);
 state.vertical=T.MathUtils.damp(state.vertical,Math.abs(state.verticalVelocity)*.018+state.landingCompression*.20,4,dt);
 state.tunnel=inTunnelNow?ti.t.name:'';
 const tiBlend=tunnelAt(state.x,state.z);
 const blend=tiBlend?T.MathUtils.clamp(1-(tiBlend.dist-tiBlend.W/2)/32,0,1):0;
 state.tunnelBlend=T.MathUtils.damp(state.tunnelBlend,blend,5,dt);
 car.position.set(state.x,state.y,state.z);car.rotation.set(0,-state.heading,0);
 chassis.position.y=state.shake;
 chassis.rotation.z=lakeBump?Math.sin(state.driveDistance*2.15)*.032:0;
 chassis.rotation.x=lakeBump?Math.sin(state.driveDistance*3.1)*.045+state.landingCompression*.07:0;
 wheels.forEach(w=>{w.rotation.x+=state.speed*dt/1.12});
 const cp=checkpoints[state.progress];if(cp&&Math.hypot(state.x-cp.x,state.z-cp.z)<32){
  state.progress++;toast(state.progress===checkpoints.length?'🎉 环游完成！还可以自由探索其他岔路':'⭐ 到达 '+cp.name+'！');
 }
}
/* ==================== 10. 相机：洞内目标位置与实际位置双重钳制 ==================== */
function cameraTarget(){
 const f=new T.Vector3(Math.sin(state.heading),0,-Math.cos(state.heading)),s=new T.Vector3(Math.cos(state.heading),0,Math.sin(state.heading));
 const pos=new T.Vector3(state.x,state.y,state.z),look=pos.clone(),b=state.tunnelBlend;
 if(state.cam===0){
  const back=T.MathUtils.lerp(-23,-9,b),high=T.MathUtils.lerp(15,6.4,b),ahead=T.MathUtils.lerp(13,8,b);
  pos.addScaledVector(f,back).y+=high;look.addScaledVector(f,ahead).y+=3.2;
 }else if(state.cam===1){pos.addScaledVector(f,15).addScaledVector(s,17).y+=10;look.y+=3}
 else{pos.y+=78;look.addScaledVector(f,7)}
 pos.y+=state.vertical*.22;look.y+=state.vertical*.08;
 // 洞内相机沿隧道轴线布置：即使车辆在弯道上急打方向，相机也不会贴壁或穿顶
 const ti=tunnelAt(state.x,state.z);
 if(state.cam===0&&b>.35&&ti&&ti.inside){
  const back=Math.max(0,ti.k-2),front=Math.min(ti.t.axis.length-1,ti.k+2),A=ti.t.axis[back],B=ti.t.axis[front];
  const ap=new T.Vector3(A.x,ti.y0+5.7,A.z),al=new T.Vector3(B.x,ti.y0+3.1,B.z);
  pos.lerp(ap,b*.92);look.lerp(al,b*.92);
 }
 return {pos,look};
}
function clampCamera(pos){
 const ti=tunnelAt(pos.x,pos.z);
 if(!ti||!ti.inside||ti.dist>ti.W/2+8)return pos;
 const lim=ti.W/2-1.0,lat=Math.max(-lim,Math.min(lim,ti.lat)),a=ti.a,along=ti.along;
 pos.x=a.x+a.nx*lat+a.nz*along;pos.z=a.z+a.nz*lat-a.nx*along;
 pos.y=Math.max(ti.y0+1.5,Math.min(ti.y0+ti.top-.9,pos.y));
 return pos;
}
function cameraUpdate(dt){
 const {pos,look}=cameraTarget(),b=state.tunnelBlend;
 if(b>.02)clampCamera(pos);
 camera.position.lerp(pos,1-Math.exp(-4*dt));
 if(b>.02){clampCamera(camera.position);camera.position.lerp(clampCamera(pos),b*.55)}
 camera.lookAt(look);
 return {pos,look};
}
const ctx=mini.getContext('2d');function dot(x,z){return [(x+1500)/3000*mini.width,(1500-z)/3000*mini.height]}
function mapRender(){
 ctx.fillStyle='#e2efdc';ctx.fillRect(0,0,mini.width,mini.height);
 ctx.fillStyle='#73cee3';let p=dot(-800,655);ctx.beginPath();ctx.arc(...p,26,0,7);ctx.fill();
 for(const l of lines){ctx.strokeStyle=l.kind==='gravel'?'#ba965f':l.kind==='mountain'?'#9b75c8':'#89989c';ctx.lineWidth=l.kind==='mountain'?2.5:2;ctx.beginPath();l.pts.forEach((v,i)=>{p=dot(v[0],v[1]);if(!i)ctx.moveTo(...p);else ctx.lineTo(...p)});ctx.stroke()}
 for(let i=0;i<checkpoints.length;i++){p=dot(checkpoints[i].x,checkpoints[i].z);ctx.fillStyle=i<state.progress?'#4ca66b':'#ffc238';ctx.beginPath();ctx.arc(...p,3.5,0,7);ctx.fill()}
 p=dot(state.x,state.z);ctx.fillStyle='#e64d60';ctx.beginPath();ctx.arc(...p,5,0,7);ctx.fill();
}
function updateAtmosphere(b){
 scene.fog.near=T.MathUtils.lerp(420,28,b);scene.fog.far=T.MathUtils.lerp(1150,205,b);
 sun.intensity=T.MathUtils.lerp(2,.55,b);hemi.intensity=T.MathUtils.lerp(2.6,1.15,b);
 $('tunnelShade').style.opacity=(b*.42).toFixed(3);
 tunnelLights.forEach(l=>{l.intensity=b*1.4});
}
let frame=0,last=performance.now();
const beaconBase=checkpoints.map(p=>closestRoad(p.x,p.z).y+12);
function animate(now){
 const dt=Math.min(.05,Math.max(.001,(now-last)/1000));last=now;
 if(!state.freeCam){drive(dt);cameraUpdate(dt);updateAtmosphere(state.tunnelBlend)}
 for(let i=0;i<beacons.length;i++){beacons[i].rotation.y+=dt*.7;beacons[i].position.y=beaconBase[i]+Math.sin(now*.001+i)*.8}
 if(now>toastTime)$('toast').classList.remove('show');
 if(frame++%7===0){
  const near=closestRoad(state.x,state.z);
  $('telemetry').textContent='速度 '+Math.round(Math.abs(state.speed)*3.6)+' km/h · 海拔 '+Math.round(state.y-1)+' m';
  $('region').textContent=state.tunnel?'🚇 '+state.tunnel:state.airborne?'🚙 越野腾空中':near.kind==='mountain'?'⛰ 贴山公路 · 护栏挡墙':near.kind==='gravel'?'🚙 湖畔碎石颠簸路':near.distance<24?'🛣 '+near.name:'🌿 自由越野区域';
  const cp=checkpoints[state.progress];$('task').textContent=cp?'下一站：'+cp.name+' · '+Math.round(Math.hypot(state.x-cp.x,state.z-cp.z))+'m':'✅ 已环游完成，继续兜风';
  mapRender();
 }
 renderer.render(scene,camera);requestAnimationFrame(animate);
}
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
state.zoom=1;$('loading').style.display='none';toast('V0.4 隧道不穿模 · 道路无障碍 · 山路湖畔全面美化');requestAnimationFrame(animate);

/* ==================== 11. 验收审计与预览调试接口（不改动玩法） ==================== */
window.__V04_AUDIT__={
 version:'V0.4',worldSize:3000,
 roads:lines.map(l=>({name:l.name,kind:l.kind,width:l.width,samples:l.pts.length})),
 tunnels:TUNNELS.map(t=>({name:t.name,road:t.road,iA:t.iA,iB:t.iB,t0:t.t0,t1:t.t1,rings:t.rings,width:t.W,wall:t.wall,top:t.top,shellGap:SHELL,profilePoints:K,deckLift:DECK_LIFT})),
 deckGaps:AUDIT.deckGaps,
 obstacles:AUDIT.obstacles,
 violations:AUDIT.obstacles.filter(o=>!o.ok),
 rejected:AUDIT.rejected,
 counts:{houses:houseCount,trees:trees.length,lamp:lampPoles.length,pebbles:pebbles.length,portalRocks:portalRocks.length,capRocks:capRocks.length,viewpoints:2}
};
window.__V04_DEBUG__={
 state,camera,scene,renderer,lines,TUNNELS,tunnelAt,closestRoad,clearance,
 setPose(x,z,heading,camMode=0){
  state.freeCam=false;camera.far=1400;camera.updateProjectionMatrix();
  state.x=x;state.z=z;state.heading=heading;state.speed=0;state.shake=0;state.vertical=0;state.airborne=false;state.verticalVelocity=0;
  state.cam=camMode;state.y=closestRoad(x,z).y+1.2;
  const ti=tunnelAt(x,z);state.tunnel=ti&&ti.inside&&Math.abs(ti.lat)<ti.W/2?ti.t.name:'';
  state.tunnelBlend=ti?T.MathUtils.clamp(1-(ti.dist-ti.W/2)/32,0,1):0;
  car.position.set(state.x,state.y,state.z);car.rotation.set(0,-state.heading,0);
  const {pos,look}=cameraTarget();clampCamera(pos);camera.position.copy(pos);camera.lookAt(look);
  updateAtmosphere(state.tunnelBlend);mapRender();renderer.render(scene,camera);
 },
 renderOnce(){renderer.render(scene,camera)},
 setFreeCamera(px,py,pz,lx,ly,lz){
  state.freeCam=true;camera.far=9000;camera.updateProjectionMatrix();
  camera.position.set(px,py,pz);camera.lookAt(lx,ly,lz);
  scene.fog.near=2600;scene.fog.far=6800;$('tunnelShade').style.opacity='0';
  renderer.render(scene,camera);
 },
 probe(){
  const dirs=[[0,0],[0,.55],[0,-.55],[-.6,0],[.6,0],[-.6,.7],[.6,.7],[0,.85],[-.8,.95],[.8,.95],[0,.97],[-.95,.5],[.95,.5]],out=[];
  for(const [x,y] of dirs){
   const rc=new T.Raycaster();rc.far=400;rc.setFromCamera(new T.Vector2(x,y),camera);
   const hs=rc.intersectObjects(scene.children,true);
   out.push({dir:[x,y],hits:hs.slice(0,3).map(h=>({d:+h.distance.toFixed(1),name:h.object.name||h.object.type,geo:h.object.geometry?.type,c:h.object.material?.color?.getHexString?.(),vc:!!h.object.material?.vertexColors,cnt:h.object.geometry?.attributes?.position?.count,inst:!!h.object.isInstancedMesh}))});
  }
  return out;
 },
 // 高速穿隧道压力测试：逐帧检查车辆与相机是否越过洞壁/洞顶净空
 simulate(seconds,opts={}){
  const n=Math.round(seconds*60),dt=1/60;
  let carViolations=0,camViolations=0,maxLat=0,maxCamY=0,framesInTunnel=0,airFrames=0,maxJump=0;
  for(const k of ['left','right','gas','brake'])buttons[k]=!!opts[k];
  for(let i=0;i<n;i++){
   drive(dt);cameraUpdate(dt);
   if(state.airborne)airFrames++;
   maxJump=Math.max(maxJump,state.y-closestRoad(state.x,state.z).y-1.2);
   const ti=tunnelAt(state.x,state.z),tc=tunnelAt(camera.position.x,camera.position.z);
   if(ti&&ti.inside&&ti.dist<ti.W/2+4){
    framesInTunnel++;maxLat=Math.max(maxLat,Math.abs(ti.lat));
    if(Math.abs(ti.lat)>ti.W/2-2.9||state.y>ti.y0+ti.top-5.2)carViolations++;
   }
   if(tc&&tc.inside&&tc.dist<tc.W/2+4){
    maxCamY=Math.max(maxCamY,camera.position.y-tc.y0);
    if(Math.abs(tc.lat)>tc.W/2-.85||camera.position.y>tc.y0+tc.top-.8||camera.position.y<tc.y0+1.35)camViolations++;
   }
  }
  for(const k of ['left','right','gas','brake'])buttons[k]=false;
  return {frames:n,framesInTunnel,carViolations,camViolations,airFrames,maxJump:+maxJump.toFixed(2),maxLat:+maxLat.toFixed(2),maxCamY:+maxCamY.toFixed(2),x:+state.x.toFixed(1),z:+state.z.toFixed(1),tunnel:state.tunnel};
 },
 tunnelAt,closestRoad
};
