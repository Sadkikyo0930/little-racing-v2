<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
/* ==================== 0. 渲染基础：地中海晴空 / 程序化 PBR 纹理 / 批处理 / 移动端降级 ==================== */
const $=id=>document.getElementById(id);
const MOBILE=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||Math.min(innerWidth,innerHeight)<760;
const TEXSIZE=MOBILE?256:512;
const DETAIL=MOBILE?.62:1;                 // 实例密度系数：移动设备主动降载
const renderer=new T.WebGLRenderer({canvas:$('scene'),antialias:!MOBILE,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,MOBILE?1.25:1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#9ed2ee');
scene.fog=new T.Fog('#cfe6ee',420,1500);
const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,3000);

let seed=70321;function rnd(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function texCanvas(w,h,paint){const c=document.createElement('canvas');c.width=w;c.height=h;paint(c.getContext('2d'),w,h);
 const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=MOBILE?2:4;return t}
function noiseFill(g,w,h,base,palette,count,rmin,rmax){
 g.fillStyle=base;g.fillRect(0,0,w,h);
 for(let i=0;i<count;i++){const x=rnd()*w,y=rnd()*h,r=rmin+rnd()*(rmax-rmin);
  g.globalAlpha=.12+rnd()*.32;g.fillStyle=palette[Math.floor(rnd()*palette.length)];
  g.beginPath();g.arc(x,y,r,0,6.2832);g.fill()}
 g.globalAlpha=1;
}
/* --- 预烘焙天空：渐变 + 蓬松积云，运行时零 shader 成本（移动端友好） --- */
function skyTex(){
 return texCanvas(1024,512,(g,w,h)=>{
  const grd=g.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'#2272bd');grd.addColorStop(.34,'#56a5dc');grd.addColorStop(.60,'#9bd0ee');grd.addColorStop(.78,'#dceef3');grd.addColorStop(1,'#f5e7c8');
  g.fillStyle=grd;g.fillRect(0,0,w,h);
  // 稀疏积云：只占中段云带，顶部保持干净蓝天（避免整片刷白）
  for(let layer=0;layer<2;layer++){
   const n=[13,8][layer],cy=[168,218][layer],alpha=[.26,.40][layer];
   for(let i=0;i<n;i++){
    const cx=rnd()*w,y=cy+(rnd()-.5)*52,s=13+rnd()*(layer===1?20:14);
    for(let p=0;p<5;p++){
     const px=cx+(p-2)*s*.62,py=y-Math.abs(p-2)*s*.12+(rnd()-.5)*s*.16,pr=s*(.50+rnd()*.45);
     g.globalAlpha=alpha;
     const cg=g.createRadialGradient(px,py-pr*.2,pr*.1,px,py,pr);
     cg.addColorStop(0,'#ffffff');cg.addColorStop(.62,'#fbfdff');cg.addColorStop(1,'rgba(232,242,250,0)');
     g.fillStyle=cg;g.beginPath();g.ellipse(px,py,pr*1.2,pr*.72,0,0,6.2832);g.fill();
    }
   }
  }
  g.globalAlpha=1;
 });
}
const sky=new T.Mesh(new T.SphereGeometry(1800,32,20),new T.MeshBasicMaterial({map:skyTex(),side:T.BackSide,depthWrite:false,fog:false}));
sky.frustumCulled=false;scene.add(sky);
const hemi=new T.HemisphereLight(0xfff6e4,0x7f9c8f,1.55);scene.add(hemi);
const sun=new T.DirectionalLight(0xffe4b4,2.0);sun.position.set(-360,460,270);sun.castShadow=true;
sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);
sun.shadow.camera.left=-560;sun.shadow.camera.right=560;sun.shadow.camera.top=560;sun.shadow.camera.bottom=-560;
sun.shadow.camera.near=1;sun.shadow.camera.far=1500;sun.shadow.bias=-.0006;sun.shadow.normalBias=.04;scene.add(sun);
const fill=new T.DirectionalLight(0xbfe2ff,.45);fill.position.set(300,260,-340);scene.add(fill);

/* --- 程序化 PBR 纹理库：所有材质共享，避免大量独立贴图占内存 --- */
const STONE=texCanvas(TEXSIZE,TEXSIZE,(g,w,h)=>{
 noiseFill(g,w,h,'#efe4c9',['#fffaf0','#d8c9a9','#c9b894','#f7edda'],520,2,13);
 const rows=6,rh=h/rows;
 for(let r=0;r<rows;r++){
  const off=(r%2)*w/8;
  g.strokeStyle='#b7a681';g.lineWidth=Math.max(1,w/256*1.6);
  g.beginPath();g.moveTo(0,r*rh);g.lineTo(w,r*rh);g.stroke();
  for(let c=0;c<8;c++){const x=off+c*w/8;g.beginPath();g.moveTo(x,r*rh);g.lineTo(x,(r+1)*rh);g.stroke()}
  for(let c=0;c<8;c++){
   g.globalAlpha=.10+rnd()*.14;g.fillStyle=rnd()<.5?'#c8b896':'#fff8e8';
   g.fillRect(off+c*w/8+2,r*rh+2,w/8-4,rh-4);
  }
 }
 g.globalAlpha=1;
});
const ASPHALT=texCanvas(TEXSIZE,TEXSIZE,(g,w,h)=>{
 noiseFill(g,w,h,'#5c6266',['#777d80','#4b5154','#898e90','#40464a'],2600,.4,1.7);
});
const COBBLE=texCanvas(TEXSIZE,TEXSIZE,(g,w,h)=>{
 noiseFill(g,w,h,'#e8dcc0',['#f5ecd6','#d3c3a2','#c6b692'],700,2,9);
 const rows=8,rh=h/rows;
 for(let r=0;r<rows;r++)for(let c=0;c<8;c++){
  const x=(c+(r%2)*.5)*w/8,y=r*rh;
  g.strokeStyle='#b9a988';g.lineWidth=Math.max(1,w/256*1.4);
  g.strokeRect(x+1,y+1,w/8-2,rh-2);
  g.globalAlpha=.12;g.fillStyle='#fffaf0';g.fillRect(x+2,y+2,w/8-4,rh*.28);g.globalAlpha=1;
 }
});
const TILE=texCanvas(TEXSIZE,TEXSIZE,(g,w,h)=>{
 g.fillStyle='#b45a3c';g.fillRect(0,0,w,h);
 const rows=9,rh=h/rows,cols=7,cw=w/cols;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const x=(c+(r%2)*.5)*cw,y=r*rh;
  const grd=g.createLinearGradient(x,y,x,y+rh);
  grd.addColorStop(0,'#d9794f');grd.addColorStop(.5,'#c26342');grd.addColorStop(1,'#8f402c');
  g.fillStyle=grd;g.beginPath();g.moveTo(x+1,y);g.lineTo(x+cw-1,y);g.lineTo(x+cw-1,y+rh-1);
  g.quadraticCurveTo(x+cw*.5,y+rh+3,x+1,y+rh-1);g.closePath();g.fill();
  g.strokeStyle='#7d3624';g.lineWidth=1;g.stroke();
 }
});
const ROCK=texCanvas(TEXSIZE,TEXSIZE,(g,w,h)=>{
 noiseFill(g,w,h,'#b9b09a',['#d8cfb6','#948b77','#e3dac2','#7d7868'],1400,2,11);
 for(let i=0;i<26;i++){
  const y=rnd()*h;g.strokeStyle=rnd()<.5?'#8b8270':'#ded4ba';g.globalAlpha=.22+rnd()*.3;
  g.lineWidth=1+rnd()*4;g.beginPath();g.moveTo(0,y);
  for(let x=0;x<=w;x+=24)g.lineTo(x,y+Math.sin(x*.035+i)*3+(rnd()-.5)*2);
  g.stroke();
 }
 g.globalAlpha=1;
});
const PLASTER=texCanvas(TEXSIZE,TEXSIZE,(g,w,h)=>{
 noiseFill(g,w,h,'#f6e9cf',['#fff7e6','#e9d9b9','#f2e2c4'],900,2,10);
});
const WOOD=texCanvas(TEXSIZE,TEXSIZE,(g,w,h)=>{
 g.fillStyle='#9c7248';g.fillRect(0,0,w,h);
 for(let i=0;i<26;i++){const y=rnd()*h;g.strokeStyle=rnd()<.5?'#7b5534':'#c19a6a';g.globalAlpha=.25+rnd()*.35;
  g.lineWidth=1+rnd()*3;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(w*.3,y+(rnd()-.5)*8,w*.7,y+(rnd()-.5)*8,w,y);g.stroke()}
 g.globalAlpha=1;
});
const KERB=texCanvas(TEXSIZE,64,(g,w,h)=>{
 for(let i=0;i<16;i++){g.fillStyle=i%2?'#c9503f':'#f6efdd';g.fillRect(i*w/16,0,w/16,h)}
 g.strokeStyle='#8c8472';g.lineWidth=2;g.beginPath();g.moveTo(0,4);g.lineTo(w,4);g.stroke();
});
const GRAVEL=texCanvas(TEXSIZE,TEXSIZE,(g,w,h)=>{
 noiseFill(g,w,h,'#bda681',['#d8c39c','#9c855f','#e6d4ae','#82704f'],2200,1,4);
});
function stripeTex(a,b,n=8){return texCanvas(256,256,(g,w,h)=>{g.fillStyle=a;g.fillRect(0,0,w,h);g.fillStyle=b;
 for(let i=0;i<n;i+=2)g.fillRect(i*w/n,0,w/n,h)})}
const AWNING_RED=stripeTex('#f7f0df','#cf5548',10),AWNING_GOLD=stripeTex('#fbf2d8','#e2a83c',10);
const LIGHT_STRIPE=stripeTex('#f7f2e6','#d35143',8);
function labelTex(text,bg='#2f5b76',fg='#ffe9b8'){
 return texCanvas(512,160,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);
  g.strokeStyle=fg;g.lineWidth=5;g.strokeRect(9,9,w-18,h-18);
  g.fillStyle=fg;g.font='bold 60px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+3)});
}
function bannerTex(){
 return texCanvas(128,256,(g,w,h)=>{
  g.fillStyle='#2b5f9e';g.fillRect(0,0,w,h);
  g.fillStyle='#e9c86a';g.beginPath();g.moveTo(8,12);g.lineTo(w-8,12);g.lineTo(w-8,h-46);g.lineTo(w/2,h-10);g.lineTo(8,h-46);g.closePath();g.fill();
  g.fillStyle='#2b5f9e';g.beginPath();g.arc(w/2,90,24,0,6.2832);g.fill();
  g.fillStyle='#f7e3a2';g.font='bold 52px serif';g.textAlign='center';g.fillText('✦',w/2,108);
  g.strokeStyle='#b8933f';g.lineWidth=4;g.strokeRect(6,10,w-12,h-56);
 });
}
const M=(c,o={})=>new T.MeshStandardMaterial({color:c,roughness:.86,...o});
const MAT={
 stone:M('#ffffff',{map:STONE,roughness:.92}),stoneDark:M('#cbbda0',{map:STONE,roughness:.95}),
 plaster:M('#ffffff',{map:PLASTER,roughness:.95}),tile:M('#ffffff',{map:TILE,roughness:.9}),
 rock:M('#ffffff',{map:ROCK,roughness:1,side:T.DoubleSide,emissive:'#2f2b23',emissiveIntensity:.38}),wood:M('#ffffff',{map:WOOD,roughness:.9}),
 cobble:M('#ffffff',{map:COBBLE,roughness:.95,side:T.DoubleSide}),
 asphalt:M('#ffffff',{map:ASPHALT,roughness:.96,vertexColors:true,side:T.DoubleSide}),
 gravel:M('#ffffff',{map:GRAVEL,roughness:1,vertexColors:true,side:T.DoubleSide}),
 kerb:M('#ffffff',{map:KERB,roughness:.85,side:T.DoubleSide}),
 cream:M('#f6ecd6',{roughness:.85}),white:M('#fffaf0',{roughness:.82}),
 gold:M('#e3bb69',{metalness:.35,roughness:.42}),iron:M('#2d3b3a',{metalness:.55,roughness:.5}),
 blue:M('#2f6ea8',{roughness:.7}),green:M('#5f8f63',{roughness:.9}),
 red:M('#c9503f',{roughness:.85}),glass:M('#bfe8f2',{transparent:true,opacity:.36,roughness:.08,metalness:.1}),
 glow:M('#fff2c0',{emissive:'#ffd878',emissiveIntensity:1.3,roughness:.4}),
 awningRed:M('#ffffff',{map:AWNING_RED,side:T.DoubleSide,roughness:.9}),
 awningGold:M('#ffffff',{map:AWNING_GOLD,side:T.DoubleSide,roughness:.9}),
 banner:M('#ffffff',{map:bannerTex(),side:T.DoubleSide,roughness:.9}),
 lightStripe:M('#ffffff',{map:LIGHT_STRIPE,roughness:.8}),
 water:null,ground:M('#93bd83',{roughness:1})
};
const geoBox=(w,h,d)=>new T.BoxGeometry(w,h,d);
function part(g,m,x,y,z){const o=new T.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o}
function cube(x,y,z,w,h,d,m){return part(geoBox(w,h,d),m,x,y,z)}
function cyl(x,y,z,r,h,m,n=14){return part(new T.CylinderGeometry(r,r,h,n),m,x,y,z)}
function ball(x,y,z,r,m,d=1){return part(new T.IcosahedronGeometry(r,d),m,x,y,z)}
function instanced(geo,mat,list,fn){
 if(!list||!list.length)return null;
 const im=new T.InstancedMesh(geo,mat,list.length),d=new T.Object3D();
 list.forEach((v,i)=>{d.position.set(0,0,0);d.rotation.set(0,0,0);d.scale.set(1,1,1);fn(d,v,i);d.updateMatrix();im.setMatrixAt(i,d.matrix)});
 im.instanceMatrix.needsUpdate=true;im.frustumCulled=false;scene.add(im);return im;
}
/* 带状网格：按累计弧长铺 UV，避免纹理拉伸；同材质可批量合并 */
function ribbonData(rows,tile=4){
 const v=[],u=[],idx=[];let acc=0;
 rows.forEach((r,i)=>{
  if(i>0)acc+=Math.hypot(r[0][0]-rows[i-1][0][0],r[0][1]-rows[i-1][0][1],r[0][2]-rows[i-1][0][2]);

function stoneArch(cx,cy,cz,nx,nz,radius,thick,width,count=13,mat=MAT.stone){
 const tx=nz,tz=-nx;                       // 切向 = 拱的进深方向
 const p=(r,a,w)=>[cx+nx*(r*Math.cos(a))+tx*w,cy+r*Math.sin(a),cz+nz*(r*Math.cos(a))+tz*w];
 const batch=new Batch(mat);
 for(let i=0;i<count;i++){
  const a0=Math.PI*i/count,a1=Math.PI*(i+1)/count;
  const A=p(radius,a0,-width/2),B=p(radius+thick,a0,-width/2),
        C=p(radius+thick,a1,-width/2),D=p(radius,a1,-width/2),
        A2=p(radius,a0,width/2),B2=p(radius+thick,a0,width/2),
        C2=p(radius+thick,a1,width/2),D2=p(radius,a1,width/2);
  batch.quad(A,B,C,D,0,1,0,1);batch.quad(A2,D2,C2,B2,0,1,0,1);
  batch.quad(A,A2,B2,B,0,1,0,1);batch.quad(D,C,C2,D2,0,1,0,1);
  batch.quad(B,B2,C2,C,0,1,0,1);batch.quad(A,D,D2,A2,0,1,0,1);
 }
 return batch.flush('stone-arch');
}

function compassTex(){
 const t=texCanvas(512,512,(g,w,h)=>{
  const cx=w/2,cy=h/2;
  g.fillStyle='#e7d9ba';g.fillRect(0,0,w,h);
  // 32 道放射楔形石砖，交替米白 / 浅赭
  for(let i=0;i<32;i++){
   const a0=i/32*6.2832,a1=(i+1)/32*6.2832;
   g.fillStyle=i%2?'#f0e4c9':'#dccbaa';
   g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,w/2,a0,a1);g.closePath();g.fill();
   g.strokeStyle='#b8a684';g.lineWidth=1.4;g.stroke();
  }
  // 同心石环
  for(const [r0,r1,col] of [[46,58,'#cdb996'],[112,126,'#f2e7cd'],[168,182,'#cdb996'],[220,232,'#f2e7cd']]){
   g.strokeStyle=col;g.lineWidth=r1-r0;g.beginPath();g.arc(cx,cy,(r0+r1)/2,0,6.2832);g.stroke();
   g.strokeStyle='#b3a17e';g.lineWidth=1.6;
   g.beginPath();g.arc(cx,cy,r0,0,6.2832);g.stroke();
   g.beginPath();g.arc(cx,cy,r1,0,6.2832);g.stroke();
  }
  // 八芒罗盘星
  g.save();g.translate(cx,cy);
  for(let i=0;i<8;i++){
   g.rotate(6.2832/8);
   g.fillStyle=i%2?'#e0bb6c':'#f4e0a8';
   g.beginPath();g.moveTo(0,0);g.lineTo(-16,-46);g.lineTo(0,-96);g.lineTo(16,-46);g.closePath();g.fill();
   g.strokeStyle='#b08e48';g.lineWidth=1.5;g.stroke();
  }
  g.restore();
  // 细颗粒质感
  noiseFill(g,w,h,'rgba(0,0,0,0)',['#ffffff','#a08c68','#fff8e8'],900,1,3);
 });
 t.wrapS=t.wrapT=T.ClampToEdgeWrapping;return t;
}

   const seaGap=(a>3.42&&a<4.55)?clamp(1-Math.abs(a-3.98)/.55,0,1):0;
   const raw=48+layer*22+Math.sin(a*5+layer*1.7)*22+Math.sin(a*11+layer)*11;
   const h=raw*(1-seaGap*.94)+2*seaGap;
   rows.push([[Math.cos(a)*r,.3,Math.sin(a)*r],[Math.cos(a)*r,h,Math.sin(a)*r]]);

    穿山公路俯看就成了悬在草地上空的米色纸片。这里改为四面墙 + 双坡屋顶，
    统一基准 y=.5（地面），尺寸收敛，任何视角看都是实体建筑。 */
 const far=new Batch(MAT.plaster),farRoof=new Batch(MAT.tile);

   const w=3.6+rnd()*2.2,d=3.2+rnd()*1.8,h=5+rnd()*4,base=.5;
   const dx=Math.cos(a+.1),dz=Math.sin(a+.1);
   const p=(u,v,yy)=>[x+dx*u-dz*v,yy,z+dz*u+dx*v];
   far.quad(p(-w,-d,base),p(w,-d,base),p(w,-d,base+h),p(-w,-d,base+h),0,1,0,1);

function cameraTarget(){

     画面被岩纹整屏遮挡；这里收敛为「洞内后视 / 洞内近距侧后视 / 洞内高位后视」。
     注意：这只是相机自身不穿几何；车辆碰撞体是否穿洞壁仍由 tunnelAt + 车身半宽逐帧独立判定，
     绝不用相机遮挡来掩盖车辆穿模。 */
  const dirx=ti.a.nz,dirz=-ti.a.nx,fx=Math.sin(state.heading),fz=-Math.cos(state.heading);
  const sg=(fx*dirx+fz*dirz)>=0?1:-1;
  const back=state.cam===1?12:state.cam===2?28:20;
  const side=0;   // 洞内不侧向偏移：侧视会扫到洞口立面，造成半屏遮挡
  const high=state.cam===1?3.6:state.cam===2?5.6:4.6;

 $('telemetry').textContent='速度 '+Math.round(Math.abs(state.speed)*3.6)+' km/h · 海拔 '+Math.round(state.y-1.2)+' m';
 let label='🌿 精品岛';
 if(state.tunnel)label='🚇 '+state.tunnel+' · 洞内';
 else if(state.airborne)label='🚙 越野腾空中';
 else if(Math.hypot(state.x,state.z)<62)label='🏛 中央魔法广场 / 出生点';
 else if(near.kind==='mountain')label='⛰ 穿山公路';
 else if(near.kind==='gravel')label='🏞 湖畔碎石颠簸路';
 else if(Math.hypot(state.x+300,state.z+235)<80)label='🗼 灯塔海崖';
 else if(state.z<-150&&Math.abs(state.x)<130)label='🏘 海滨小镇';
 else if(state.z>140&&state.x<0)label='🏞 湖畔区域';
 else label='🛣 '+near.name;
 $('region').textContent=label;
}
/* 帧时间采样：用于提交可量化的性能数据，不凭感觉宣称达标 */
const frameTimes=[];let frame=0,last=performance.now();window.__V07_PAUSE__=false;
function animate(now){
 const rawMs=now-last;last=now;
 frameTimes.push(rawMs);if(frameTimes.length>240)frameTimes.shift();
 const dt=Math.min(.05,Math.max(.001,rawMs/1000));
 waterUniforms.uTime.value+=dt;
 if(beaconBeam)beaconBeam.rotation.y+=dt*.32;
 if(!state.freeCam&&!window.__V07_PAUSE__){drive(dt);cameraUpdate(dt);updateAtmosphere(state.tunnelBlend)}
 if(now>toastTime)$('toast').classList.remove('show');
 if(frame++%7===0){hud();mapRender()}
 renderer.render(scene,camera);requestAnimationFrame(animate);
}
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
syncPose(ZONES.home);updateZoneUI();mapRender();$('loading').style.display='none';
toast('V0.7 精品美术重构 · 隔离候选 · 右侧按钮一键看五个场景');requestAnimationFrame(animate);
/* ==================== 审计与逐帧调试接口（P0 实际驾驶验证依赖） ==================== */
window.__V07_AUDIT__={
 version:'V0.7',kind:'boutique-art-rebuild',isolated:true,mobile:MOBILE,detail:DETAIL,textureSize:TEXSIZE,
 worldRadius:620,build:'isolated-candidate',
 zones:Object.keys(ZONES).map(k=>({key:k,name:ZONES[k].name,x:+ZONES[k].x.toFixed(1),z:+ZONES[k].z.toFixed(1)})),
 views:Object.keys(VIEWS),
 roads:lines.map(l=>({name:l.name,kind:l.kind,width:l.width,samples:l.pts.length,length:Math.round(l.cum[l.cum.length-1])})),
 tunnels:TUNNELS.map(t=>({name:t.name,road:t.road,iA:t.iA,iB:t.iB,rings:t.rings,width:t.W,top:t.top,
  shellGap:SHELL,profilePoints:K,length:+((t.t1-t.t0)*t.meta.curve.getLength()).toFixed(1),
  start:[+t.axis[0].x.toFixed(1),+t.axis[0].z.toFixed(1),+t.axis[0].y0.toFixed(1)],
  end:[+t.axis[t.axis.length-1].x.toFixed(1),+t.axis[t.axis.length-1].z.toFixed(1),+t.axis[t.axis.length-1].y0.toFixed(1)]})),
 p0:{strict3DVolume:true,singleContinuousRoad:true,noDoubleDeck:true,noCarTeleport:true,
  roadShadingByAxialProgress:true,approachLaneTaper:true,approachRings:APPROACH_U,
  carHalfWidth:CAR_HALF_W,guideStepPerFrame:GUIDE_STEP,entranceYExtrapolation:true},
 roadTiles:AUDIT.roadTiles,obstacleCount:AUDIT.obstacles.length,
 violations:AUDIT.obstacles.filter(o=>!o.ok),rejected:AUDIT.rejected,obstacles:AUDIT.obstacles,
 drawCallOptimization:OPT,
 art:{plaza:AUDIT.plaza,lake:AUDIT.lake,tunnel:AUDIT.tunnel,town:AUDIT.town,
  lighthouse:AUDIT.lighthouse,distance:AUDIT.distance},
 quickLook:{teleport:true,compactLayout:true,presetCameras:Object.keys(VIEWS).length,keyboard:'1/2/3/4/0'},
 references:['中央魔法广场目标图','山岳隧道入口目标图','海滨小镇目标图','灯塔海崖赛道目标图'],
 propCounts:Object.fromEntries(Object.keys(P).map(k=>[k,P[k].length]))
};
window.__V07_DEBUG__={
 state,camera,scene,renderer,lines,TUNNELS,ZONES,VIEWS,waterUniforms,frameTimes,
 teleport,preset,resumeDrive,closestRoad,clearance,tunnelAt,drive,cameraUpdate,
 setPause(v){window.__V07_PAUSE__=!!v;return window.__V07_PAUSE__},
 setPose(x,z,heading,camMode=0){
  syncPose({x,z,h:heading});state.cam=camMode;
  const {pos,look}=cameraTarget();clampCamera(pos);camera.position.copy(pos);camera.lookAt(look);
  updateAtmosphere(state.tunnelBlend);mapRender();renderer.render(scene,camera);
 },
 setCam(m){state.cam=m;const {pos,look}=cameraTarget();camera.position.copy(pos);camera.lookAt(look);renderer.render(scene,camera)},
 setFreeCamera(px,py,pz,lx,ly,lz){
  state.freeCam=true;camera.far=8000;camera.updateProjectionMatrix();
  camera.position.set(px,py,pz);camera.lookAt(lx,ly,lz);
  scene.fog.near=3000;scene.fog.far=8000;$('tunnelShade').style.opacity='0';renderer.render(scene,camera);
 },
 renderOnce(){renderer.render(scene,camera)},
 probe(dirs){
  const list=dirs||[[0,0],[0,.55],[0,-.55],[-.6,0],[.6,0],[-.6,.7],[.6,.7],[0,.85],[-.8,.95],[.8,.95],[0,.97],[-.95,.5],[.95,.5]],out=[];
  for(const [x,y] of list){
   const rc=new T.Raycaster();rc.far=600;rc.setFromCamera(new T.Vector2(x,y),camera);
   const hs=rc.intersectObjects(scene.children,true);
   out.push({dir:[x,y],hits:hs.slice(0,3).map(h=>({d:+h.distance.toFixed(1),name:h.object.name||h.object.type,
    geo:h.object.geometry?.type,c:h.object.material?.color?.getHexString?.(),
    mat:h.object.material?.type,inst:!!h.object.isInstancedMesh,instanceId:h.instanceId}))});
  }
  return out;
 },
 /* 列出场景中的实例化 / 平面物件，用于定位悬浮装饰 */
 listDecor(){
  const out=[];
  for(const o of scene.children){
   if(!o.isMesh)continue;
   const g=o.geometry,m=o.material;
   if(!g)continue;
   const rec={name:o.name||'(unnamed)',geo:g.type,count:o.isInstancedMesh?o.count:1,
    color:m?.color?.getHexString?.()||'',mat:m?.type||'',inst:!!o.isInstancedMesh,visible:o.visible};
   if(o.isInstancedMesh){
    const a=o.instanceMatrix.array;let min=[1e9,1e9,1e9],max=[-1e9,-1e9,-1e9];
    for(let i=0;i<o.count;i++){const b=i*16;
     for(let k=0;k<3;k++){const v=a[b+12+k];min[k]=Math.min(min[k],v);max[k]=Math.max(max[k],v)}}
    rec.min=min.map(v=>+v.toFixed(1));rec.max=max.map(v=>+v.toFixed(1));
   }else rec.pos=[+o.position.x.toFixed(1),+o.position.y.toFixed(1),+o.position.z.toFixed(1)];
   out.push(rec);
  }
  return out;
 },
 /* 单帧推进：真实调用 drive + cameraUpdate，返回该帧完整状态，用于逐帧驾驶记录 */
 stepFrame(dt=1/60,opts={}){
  for(const k of ['left','right','gas','brake'])buttons[k]=!!opts[k];
  if(opts.speed!==undefined)state.speed=opts.speed;
  if(opts.pose)this.setPose(...opts.pose);
  state.freeCam=false;
  drive(dt);cameraUpdate(dt);updateAtmosphere(state.tunnelBlend);
  if(opts.render===true)renderer.render(scene,camera);
  const ti=tunnelAt(state.x,state.z,state.y),tc=tunnelAt(camera.position.x,camera.position.z,camera.position.y),
   road=closestRoad(state.x,state.z);
  return {x:+state.x.toFixed(3),z:+state.z.toFixed(3),y:+state.y.toFixed(3),
   heading:+state.heading.toFixed(4),speed:+state.speed.toFixed(3),camMode:state.cam,
   airborne:state.airborne,tunnel:state.tunnel,blend:+state.tunnelBlend.toFixed(3),
   roadY:+road.y.toFixed(3),roadDist:+road.distance.toFixed(3),roadKind:road.kind,
   cam:[+camera.position.x.toFixed(3),+camera.position.y.toFixed(3),+camera.position.z.toFixed(3)],
   ti:ti?{u:+ti.u.toFixed(2),lat:+ti.lat.toFixed(2),dist:+ti.dist.toFixed(2),y0:+ti.y0.toFixed(2),
    inside:ti.inside,inLat:ti.inLat,inAlong:ti.inAlong,inY:ti.inY}:null,
   camTi:tc?{inside:tc.inside,lat:+tc.lat.toFixed(2),y0:+tc.y0.toFixed(2)}:null};
 },
 simulate(seconds,opts={}){
  if(opts.zone)teleport(opts.zone);
  if(opts.pose)this.setPose(...opts.pose);
  state.freeCam=false;
  const n=Math.round(seconds*60),dt=1/60;
  let carV=0,camV=0,maxLat=0,maxCamY=0,framesIn=0,air=0,maxJump=0,maxStep=0,teleports=0;
  let px=state.x,pz=state.z;
  for(let i=0;i<n;i++){
   for(const k of ['left','right','gas','brake'])buttons[k]=!!opts[k];
   if(opts.startSpeed!==undefined&&i===0)state.speed=opts.startSpeed;
   drive(dt);cameraUpdate(dt);
   const step=Math.hypot(state.x-px,state.z-pz);maxStep=Math.max(maxStep,step);
   if(step>3)teleports++;
   px=state.x;pz=state.z;
   if(state.airborne)air++;
   maxJump=Math.max(maxJump,state.y-closestRoad(state.x,state.z).y-1.2);
   const ti=tunnelAt(state.x,state.z,state.y),tc=tunnelAt(camera.position.x,camera.position.z,camera.position.y);
   if(ti&&ti.inside){framesIn++;maxLat=Math.max(maxLat,Math.abs(ti.lat));
    if(Math.abs(ti.lat)>ti.W/2-1.8||state.y>ti.y0+ti.top-3.0||state.y<ti.y0-2)carV++}
   if(tc&&tc.inside){maxCamY=Math.max(maxCamY,camera.position.y-tc.y0);
    if(Math.abs(tc.lat)>tc.W/2-.8||camera.position.y>tc.y0+tc.top-.8||camera.position.y<tc.y0+1.3)camV++}
  }
  for(const k of ['left','right','gas','brake'])buttons[k]=false;
  return {frames:n,framesInTunnel:framesIn,carViolations:carV,camViolations:camV,airFrames:air,
   maxJump:+maxJump.toFixed(2),maxLat:+maxLat.toFixed(2),maxCamY:+maxCamY.toFixed(2),
   maxStep:+maxStep.toFixed(2),teleports,x:+state.x.toFixed(1),z:+state.z.toFixed(1),tunnel:state.tunnel};
 },
 guideAudit(){return {...GUIDE_AUDIT,totalCorrection:+GUIDE_AUDIT.totalCorrection.toFixed(2),
  maxCorrection:+GUIDE_AUDIT.maxCorrection.toFixed(2),
  maxAbsLatInTunnel:+GUIDE_AUDIT.maxAbsLatInTunnel.toFixed(2)}},
 resetGuideAudit(){for(const k of Object.keys(GUIDE_AUDIT))GUIDE_AUDIT[k]=0;return true},
 perf(){
  const all=frameTimes.length,raw=frameTimes.slice(3).filter(v=>v>0&&v<10000);
  const s=raw.sort((a,b)=>a-b),n=s.length||1;
  const q=p=>raw.length?+s[Math.min(raw.length-1,Math.floor(p*raw.length))].toFixed(2):0;
  return {samples:all,warmSamples:raw.length,coldSamplesSkipped:Math.min(3,all),medianMs:q(.5),p95Ms:q(.95),worstMs:raw.length?+s[raw.length-1].toFixed(2):0,
   approxFps:+(1000/Math.max(1,q(.5))).toFixed(1),
   drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,
   points:renderer.info.render.points,lines:renderer.info.render.lines,
   geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures,
   programs:renderer.info.programs?.length||0,mobile:MOBILE,detail:DETAIL,textureSize:TEXSIZE,
   pixelRatio:renderer.getPixelRatio(),mergedGroups:OPT.mergedGroups,savedCalls:OPT.savedCalls};
 },
 getAudit(){return window.__V07_AUDIT__}
};
