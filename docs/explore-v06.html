import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
/* ==================== 0. 渲染基础：渐变天空 / 黄昏光 / 阴影 / 精致材质 ==================== */
const $=id=>document.getElementById(id),renderer=new T.WebGLRenderer({canvas:$('scene'),antialias:true,powerPreference:'high-performance'});

const sky=new T.Mesh(new T.SphereGeometry(1600,32,20),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,

 vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
 fragmentShader:'varying vec3 vP;uniform vec3 top,mid,low;void main(){float h=normalize(vP).y;vec3 c=mix(low,mid,smoothstep(-0.12,0.30,h));c=mix(c,top,smoothstep(0.22,0.85,h));gl_FragColor=vec4(c,1.0);}'}));

const hemi=new T.HemisphereLight(0xfff3df,0x7d9b83,2.15);scene.add(hemi);
const sun=new T.DirectionalLight(0xffd9a0,2.55);sun.position.set(-330,420,250);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-520;sun.shadow.camera.right=520;sun.shadow.camera.top=520;sun.shadow.camera.bottom=-520;

const fill=new T.DirectionalLight(0xc7e6ff,.62);fill.position.set(280,240,-330);scene.add(fill);
const M=(c,o={})=>new T.MeshStandardMaterial({color:c,roughness:.86,...o});
const geoBox=(w,h,d)=>new T.BoxGeometry(w,h,d);
function part(g,m,x,y,z){const o=new T.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o}
function cube(x,y,z,w,h,d,m){return part(geoBox(w,h,d),m,x,y,z)}
function cyl(x,y,z,r,h,m,n=14){return part(new T.CylinderGeometry(r,r,h,n),m,x,y,z)}
function ball(x,y,z,r,m,d=1){return part(new T.IcosahedronGeometry(r,d),m,x,y,z)}
function ribbon(rows,m,uvScale=0){
 const v=[],u=[],idx=[];
 rows.forEach((r,i)=>{v.push(...r[0],...r[1]);u.push(0,i/(uvScale||1),1,i/(uvScale||1));
  if(i<rows.length-1){const k=2*i;idx.push(k,k+1,k+2,k+1,k+3,k+2)}});

}
function instanced(geo,mat,list,fn){

let seed=60321;function rnd(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}

}
function stripeTex(a,b,n=8,vertical=false){return texCanvas(256,256,(g,w,h)=>{g.fillStyle=a;g.fillRect(0,0,w,h);g.fillStyle=b;const s=w/n;for(let i=0;i<n;i+=2){if(vertical)g.fillRect(i*s,0,s,h);else g.fillRect(0,i*s,w,s)}})}
const PALETTE={stone:'#f0e6d0',stoneDark:'#cdbfa4',wood:'#a4784c',woodDark:'#6d4d33',cream:'#fff4dc',mint:'#8fc5a3',rose:'#e79a8e',terracotta:'#d98b63',butter:'#f2cf82',slate:'#6f7d80',leaf:'#6fa268',leafDark:'#4e855d',glass:'#a8dbe8',red:'#d9554d'};
const gravelTex=speckleTex('#b39a76',['#cdb78e','#917a58','#e0cda7','#79634a','#ab926e'],1900);
const gravelMat=new T.MeshStandardMaterial({map:gravelTex,roughness:1,vertexColors:true,side:T.DoubleSide});
const roadMat=new T.MeshStandardMaterial({color:'#6f757a',roughness:.94,side:T.DoubleSide});
const edgeMat=new T.MeshStandardMaterial({color:'#fff6e2',roughness:.75,side:T.DoubleSide,emissive:'#4a4028',emissiveIntensity:.08});
const midMat=new T.MeshStandardMaterial({color:'#ffe6a4',roughness:.8,side:T.DoubleSide});
const stoneMat=M(PALETTE.stone,{roughness:.92}),stoneDarkMat=M(PALETTE.stoneDark),woodMat=M(PALETTE.wood),woodDarkMat=M(PALETTE.woodDark);

const leafMats=['#7fb56e','#6da56a','#8ec079','#5f9765'].map(c=>M(c,{roughness:.95}));
const trunkMat=M('#9a7550');
const grassMat=M('#9dc38a',{roughness:1});
// 主地面 + 一层柔和的地形色斑，避免大块纯色
const ground=new T.Mesh(new T.PlaneGeometry(2600,2600),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-2;ground.receiveShadow=true;scene.add(ground);
const groundPatchTex=speckleTex('#9dc38a',['#a8cb92','#8fb57c','#b0cf97','#8ab079'],2600);
const groundPatch=new T.Mesh(new T.PlaneGeometry(2600,2600),new T.MeshStandardMaterial({map:groundPatchTex,roughness:1,transparent:true,opacity:.5}));
groundPatch.rotation.x=-Math.PI/2;groundPatch.position.y=-1.96;scene.add(groundPatch);
// 程序化水面：渐变 + 双频波纹高光 + 菲涅尔 + 浅滩，明显区别于 V0.5 的纯色圆片
const waterUniforms={uTime:{value:0},uShallow:{value:new T.Color('#a9f2dd')},uDeep:{value:new T.Color('#2d8fb8')},uSun:{value:new T.Color('#fff6d8')}};
function waterMaterial(){
 return new T.ShaderMaterial({transparent:true,side:T.DoubleSide,uniforms:waterUniforms,
  vertexShader:'varying vec2 vU;varying vec3 vW;void main(){vU=uv;vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:`varying vec2 vU;varying vec3 vW;uniform float uTime;uniform vec3 uShallow,uDeep,uSun;
   void main(){vec2 p=vW.xz;float t=uTime;
    float w=sin(p.x*.085+t*1.15)*.5+sin(p.y*.103-t*.9)*.5+sin((p.x+p.y)*.055+t*.6)*.35;
    float w2=sin(p.x*.31-t*1.9)*sin(p.y*.27+t*1.5);
    float edge=length(vU-.5)*2.0;
    vec3 col=mix(uDeep,uShallow,clamp(.16+w*.18+edge*.52,0.0,1.0));
    float glint=pow(max(0.0,sin(p.x*.21+t*1.4)*sin(p.y*.19-t*1.1)),14.0);
    col+=uSun*glint*.42;col+=uSun*pow(max(0.0,w2),9.0)*.09;
    float foam=smoothstep(.86,1.0,edge+w*.05);col=mix(col,vec3(.93,.98,.97),foam*.6);
    gl_FragColor=vec4(col,.93);}`});
}
const WATER_MAT=waterMaterial();
const LAKE={x:-275,z:255,r:88},SEA={x:-1000,z:-800,r:800};
const inWater=(x,z,r=0)=>Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r+r||Math.hypot(x-SEA.x,z-SEA.z)<SEA.r+r;
/* ==================== 1. 紧凑精品岛路网：四区环抱出生点，最远约 330 m ==================== */
const roads=[
{name:'中央环线',kind:'asphalt',width:15,pts:[[0,128,1],[66,111,1],[111,66,1],[128,0,1],[111,-66,1],[66,-111,1],[0,-128,1],[-66,-111,1],[-111,-66,1],[-128,0,1],[-111,66,1],[-66,111,1],[0,128,1]]},
{name:'湖畔精品公路',kind:'gravel',width:13,pts:[[-66,111,1],[-105,150,2],[-140,200,3],[-150,260,4],[-135,320,3],[-95,360,2],[-40,345,2],[-15,285,1],[-20,200,1],[-15,150,1],[0,128,1]]},
{name:'盘山隧道公路',kind:'mountain',width:12,pts:[[66,111,1],[120,135,7],[175,165,18],[235,180,31],[295,205,45],[320,265,58],[285,320,70],[225,340,80],[180,300,86],[175,240,90],[215,195,94],[275,180,97],[320,220,99],[300,285,92],[245,330,80],[175,335,62],[115,285,38],[95,215,15],[111,66,1]]},
{name:'小镇主街',kind:'asphalt',width:16,pts:[[0,-128,1],[0,-200,1],[0,-275,1],[0,-350,1]]},
{name:'小镇环街',kind:'asphalt',width:11,pts:[[0,-200,1],[-95,-205,1],[-115,-285,1],[-65,-355,1],[0,-350,1],[65,-355,1],[115,-285,1],[95,-205,1],[0,-200,1]]},
{name:'灯塔海崖路',kind:'asphalt',width:12,pts:[[-66,-111,1],[-130,-160,2],[-205,-215,3],[-275,-265,3],[-300,-235,3]]},
{name:'海岸连接线',kind:'asphalt',width:11,pts:[[0,-350,1],[-130,-375,2],[-245,-355,3],[-300,-235,3]]}
];
/* ==================== 2. 隧道轴线：与道路同一条曲线，采样点严格对齐（V0.4 机制保留） ==================== */
const TUN_W=15,TUN_WALL=4.6,TUN_TOP=10.2,SHELL=3.2,DECK_LIFT=.11;
const TUNNEL_DEFS=[{road:'盘山隧道公路',a:9.05,b:10.85,name:'松云岭精品隧道',portal:'松云岭',len:'320 m',exit:'valley'}];
const METAS=roads.map(def=>({def,curve:new T.CatmullRomCurve3(def.pts.map(p=>new T.Vector3(p[0],p[2],p[1])),false,'centripetal',.4),n:0}));
METAS.forEach(m=>{m.n=Math.max(120,Math.ceil(m.curve.getLength()/11))});
const TUNNELS=TUNNEL_DEFS.map(td=>{
 const m=METAS.find(x=>x.def.name===td.road),seg=m.def.pts.length-1;
 const iA=Math.round(td.a/seg*m.n),iB=Math.round(td.b/seg*m.n),t0=iA/m.n,t1=iB/m.n;

  const t=t0+(t1-t0)*i/rings,p=m.curve.getPoint(t),v=m.curve.getTangent(Math.min(t,.99999)),l=Math.hypot(v.x,v.z)||1;

 }

});
function tunnelAt(x,z){
 let best=null;
 for(const t of TUNNELS)for(let k=0;k<t.axis.length;k++){
  const a=t.axis[k],dx=x-a.x,dz=z-a.z,d2=dx*dx+dz*dz;
  if(!best||d2<best.d2)best={t,k,d2,dx,dz,a};
 }

}

function tunnelVolumeNear(x,z,y){

const GRAVEL_CRESTS=[70,170,280,390];
function drawRoad(m){
 const {def,curve,n}=m,tun=TUNNELS.find(t=>t.meta===m),length=curve.getLength();
 const vertices=[],uvs=[],colors=[],indices=[],points=[],cum=[],edgeRuns=[[],[]],midPts=[];
 let runL=[],runR=[];
 const flush=()=>{if(runL.length>1)edgeRuns[0].push(runL);if(runR.length>1)edgeRuns[1].push(runR);runL=[];runR=[]};
 for(let i=0;i<=n;i++){
  const t=i/n,p=curve.getPoint(t),tan=curve.getTangent(Math.min(t,.99999));
  const nx=-tan.z,nz=tan.x,norm=Math.hypot(nx,nz)||1,ux=nx/norm,uz=nz/norm,half=def.width/2,meters=t*length;
  if(def.kind==='gravel'){
   for(const center of GRAVEL_CRESTS){const u=Math.abs(meters-center)/28;if(u<1)p.y+=4.2*Math.pow(1-u*u,2)}
   p.y+=.42*Math.sin(meters*.071)+.26*Math.sin(meters*.19+1.7)+.14*Math.sin(meters*.47+.5);
  }
  const wobble=def.kind==='gravel'?.34*Math.sin(meters*.13)+.18*Math.sin(meters*.31+2.2):0;
  const wobbleR=def.kind==='gravel'?.31*Math.sin(meters*.11+1.1)+.17*Math.sin(meters*.29):0;
  vertices.push(p.x+ux*(half+wobble),p.y+DECK_LIFT,p.z+uz*(half+wobble),p.x-ux*(half+wobbleR),p.y+DECK_LIFT,p.z-uz*(half+wobbleR));
  const v=meters/8;uvs.push(0,v,1,v);
  if(def.kind==='gravel'){const s=.86+.14*Math.sin(meters*.23)+.07*Math.sin(meters*.71);colors.push(s,s*.98,s*.92,s*.94,s,s*.9)}
  points.push([p.x,p.z,p.y]);cum.push(meters);
  const skip=!!tun&&i>=tun.iA&&i<tun.iB;
  if(skip){flush();AUDIT.deckGaps++}else{
   if(i<n){const k=2*i;indices.push(k,k+1,k+2,k+1,k+3,k+2)}
   const ey=p.y+DECK_LIFT+.075;
   runL.push([[p.x+ux*(half-.05),ey,p.z+uz*(half-.05)],[p.x+ux*(half-.46),ey,p.z+uz*(half-.46)]]);
   runR.push([[p.x-ux*(half-.05),ey,p.z-uz*(half-.05)],[p.x-ux*(half-.46),ey,p.z-uz*(half-.46)]]);
   if(i%10<4){const ly=p.y+DECK_LIFT+.078;midPts.push(p.x-tan.x*3,ly,p.z-tan.z*3,p.x+tan.x*3,ly,p.z+tan.z*3)}
  }
 }
 flush();
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vertices,3));
 g.setAttribute('uv',new T.Float32BufferAttribute(uvs,2));
 if(colors.length)g.setAttribute('color',new T.Float32BufferAttribute(colors,3));
 g.setIndex(indices);g.computeVertexNormals();
 const mesh=part(g,def.kind==='gravel'?gravelMat:roadMat,0,0,0);mesh.frustumCulled=false;mesh.receiveShadow=true;
 lines.push({name:def.name,kind:def.kind,width:def.width,half:def.width/2,pts:points,cum});
 for(const runs of edgeRuns)for(const run of runs)ribbon(run,edgeMat,9);
 if(midPts.length){const mg=new T.BufferGeometry();mg.setAttribute('position',new T.Float32BufferAttribute(midPts,3));scene.add(new T.LineSegments(mg,new T.LineBasicMaterial({color:'#fff0bd',transparent:true,opacity:.85})))}
}

function closestRoad(x,z){
 let best={distance:Infinity,y:0,kind:'grass',name:'草地',half:0,bend:0,px:x,pz:z,m:0};
 for(const l of lines)for(let i=1;i<l.pts.length;i++){
  const a=l.pts[i-1],b=l.pts[i],vx=b[0]-a[0],vz=b[1]-a[1],len=vx*vx+vz*vz||1,cm0=l.cum[i-1],cm1=l.cum[i];
  const t=Math.max(0,Math.min(1,((x-a[0])*vx+(z-a[1])*vz)/len));
  const dis=Math.hypot(x-a[0]-t*vx,z-a[1]-t*vz);
  if(dis<best.distance){
   let bend=0;
   if(i>1&&i<l.pts.length-1){
    const p=l.pts[i-2],q=l.pts[i+1],v1x=a[0]-p[0],v1z=a[1]-p[1],v2x=q[0]-b[0],v2z=q[1]-b[1];
    const n1=Math.hypot(v1x,v1z)||1,n2=Math.hypot(v2x,v2z)||1;
    bend=Math.max(0,1-(v1x*v2x+v1z*v2z)/(n1*n2));
   }
   best={distance:dis,y:a[2]+t*(b[2]-a[2]),kind:l.kind,name:l.name,half:l.half,bend,px:a[0]+t*vx,pz:a[1]+t*vz,m:cm0+t*(cm1-cm0)};
  }
 }
 return best;
}
/* 统一静态物体净空：路半宽 + 半径 + 基础余量 + 山地/碎石/弯道附加余量 + 隧道/水面/边界禁入 */
function clearance(x,z,y,r,margin=3){
 const c=closestRoad(x,z);
 const need=c.half+r+margin+(c.kind==='mountain'?4:0)+(c.kind==='gravel'?3:0)+c.bend*7;
 const vol=intrudesTunnel(x,y,z,r),water=inWater(x,z,r);
 const ok=c.distance>=need&&!vol&&!water&&Math.abs(x)<1150&&Math.abs(z)<1150;
 return {ok,distance:c.distance,need,y:c.y,kind:c.kind};
}
function place(x,z,y,r,kind,build,margin=3){
 const c=clearance(x,z,y,r,margin);
 if(!c.ok){AUDIT.rejected++;return false}
 AUDIT.obstacles.push({x:+x.toFixed(1),z:+z.toFixed(1),y:+y.toFixed(1),r:+r.toFixed(1),kind,distance:+c.distance.toFixed(2),need:+c.need.toFixed(2),ok:true});
 if(build)build();return true;
}

// 路肩安全护栏：位于路半宽 +2.1 m，属于道路设施而非车道障碍
function guardAlong(lineName,from,to,side){
 const l=lines.find(q=>q.name===lineName);if(!l)return;
 const step=Math.max(1,Math.round(l.pts.length/110));
 for(let i=1;i<l.pts.length-step;i+=step){
  const t=i/(l.pts.length-1);if(t<from||t>to)continue;
  const a=l.pts[i-1],b=l.pts[i],dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz)||1;
  const ux=dx/len,uz=dz/len,nx=-uz,nz=ux,off=(l.half+2.1)*side;
  const x=a[0]+nx*off,z=a[1]+nz*off,y=a[2];
  if(intrudesTunnel(x,y+1,z,1.4)||inWater(x,z,1))continue;
  const rot=-Math.atan2(dz,dx);
  GUARD_POSTS.push([x,y+1.2,z,rot]);GUARD_CAPS.push([x,y+2.5,z,rot]);
  GUARD_BEAMS.push([a[0]+nx*off+ux*len*.5,y+1.72,a[1]+nz*off+uz*len*.5,rot,len]);
 }
}

   const rc=new T.Raycaster();rc.far=500;rc.setFromCamera(new T.Vector2(x,y),camera);
   const hs=rc.intersectObjects(scene.children,true);
   out.push({dir:[x,y],hits:hs.slice(0,3).map(h=>({d:+h.distance.toFixed(1),name:h.object.name||h.object.type,geo:h.object.geometry?.type,c:h.object.material?.color?.getHexString?.(),inst:!!h.object.isInstancedMesh}))});
  }
  return out;
 },
 simulate(seconds,opts={}){
  if(opts.zone)teleport(opts.zone);
  if(opts.pose)this.setPose(...opts.pose);
  state.freeCam=false;
  const n=Math.round(seconds*60),dt=1/60;
  let carViolations=0,camViolations=0,maxLat=0,maxCamY=0,framesInTunnel=0,airFrames=0,maxJump=0;
  for(const k of ['left','right','gas','brake'])buttons[k]=!!opts[k];
  for(let i=0;i<n;i++){
   drive(dt);cameraUpdate(dt);
   if(state.airborne)airFrames++;
   maxJump=Math.max(maxJump,state.y-closestRoad(state.x,state.z).y-1.2);
   const ti=tunnelAt(state.x,state.z),tc=tunnelAt(camera.position.x,camera.position.z);
   if(ti&&ti.inside&&ti.dist<ti.W/2+4){framesInTunnel++;maxLat=Math.max(maxLat,Math.abs(ti.lat));
    if(Math.abs(ti.lat)>ti.W/2-2.9||state.y>ti.y0+ti.top-5.2)carViolations++}
   if(tc&&tc.inside&&tc.dist<tc.W/2+4){maxCamY=Math.max(maxCamY,camera.position.y-tc.y0);
    if(Math.abs(tc.lat)>tc.W/2-.85||camera.position.y>tc.y0+tc.top-.8||camera.position.y<tc.y0+1.35)camViolations++}
  }
  for(const k of ['left','right','gas','brake'])buttons[k]=false;
  return {frames:n,framesInTunnel,carViolations,camViolations,airFrames,maxJump:+maxJump.toFixed(2),maxLat:+maxLat.toFixed(2),maxCamY:+maxCamY.toFixed(2),x:+state.x.toFixed(1),z:+state.z.toFixed(1),tunnel:state.tunnel};
 },
 getAudit(){return window.__V06_AUDIT__}
};
