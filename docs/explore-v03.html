<script type="module">

const scene=new T.Scene();scene.background=new T.Color('#a9daf2');scene.fog=new T.Fog('#a9daf2',420,1150);

const M=c=>new T.MeshStandardMaterial({color:c,roughness:.95});
const roadMat=M('#74777c'),gravelMat=M('#ad9573'),edgeMat=M('#f5e8c6'),grassMat=M('#8acc76'),waterMat=new T.MeshStandardMaterial({color:'#59bad6',roughness:.25,metalness:.05,transparent:true,opacity:.96});

const roads=[
{name:'小镇环线',kind:'asphalt',width:16,pts:[[-610,-1130,1],[-450,-1080,1],[-240,-1000,1],[0,-930,1],[210,-1030,1],[410,-860,2],[320,-670,2],[50,-670,1],[-240,-760,1],[-470,-880,1],[-610,-1130,1]]},
{name:'乡村支线',kind:'asphalt',width:13,pts:[[-470,-880,1],[-690,-610,1],[-890,-450,1],[-1140,-420,1],[-1260,-150,1],[-1020,100,2],[-880,320,2]]},
{name:'湖畔碎石路',kind:'gravel',width:13,pts:[[-880,320,2],[-1020,480,3],[-1120,750,3],[-860,950,5],[-560,900,4],[-400,730,2],[-510,480,2],[-880,320,2]]},
{name:'森林与小镇联络线',kind:'asphalt',width:13,pts:[[-400,730,2],[-260,490,2],[-80,220,2],[80,-40,1],[50,-670,1]]},
{name:'盘山公路·上山',kind:'mountain',width:12,pts:[[80,-40,1],[240,170,4],[490,160,17],[750,260,44],[470,400,67],[290,530,89],[590,590,118],[980,630,153],[1060,800,187],[800,880,214],[540,980,238],[810,1130,272],[1100,1200,299],[1280,1150,320]]},
{name:'盘山公路·下山',kind:'mountain',width:12,pts:[[1280,1150,320],[1360,900,278],[1130,740,227],[1170,460,172],[920,350,120],[1080,70,61],[690,-100,18],[410,-860,2]]},
{name:'海岸风景线',kind:'asphalt',width:13,pts:[[-610,-1130,1],[-870,-1240,1],[-1140,-1160,1],[-1330,-940,1],[-1260,-730,1],[-1140,-420,1]]},
{name:'赛车场外圈',kind:'asphalt',width:16,pts:[[410,-860,2],[740,-760,2],[1050,-870,2],[1230,-1070,2],[980,-1260,2],[690,-1240,2],[410,-860,2]]},
{name:'山脚捷径',kind:'asphalt',width:11,pts:[[210,-1030,1],[480,-500,2],[690,-100,18]]},
{name:'穿林小路',kind:'gravel',width:10,pts:[[-1140,-420,1],[-780,-110,2],[-400,200,2],[-80,220,2]]}
];
const lines=[],roadSamples=[];
function drawRoad(def){
 const curve=new T.CatmullRomCurve3(def.pts.map(p=>new T.Vector3(p[0],p[2],p[1])),false,'centripetal',.4);
 const n=Math.max(120,Math.ceil(curve.getLength()/16)),vertices=[],indices=[],points=[],edges=[];
 for(let i=0;i<=n;i++){
  const t=i/n,p=curve.getPoint(t),tan=curve.getTangent(Math.min(t,.99999));const nx=-tan.z,nz=tan.x,norm=Math.hypot(nx,nz)||1,half=def.width/2;

  if(i<n){const k=2*i;indices.push(k,k+1,k+2,k+1,k+3,k+2)}

 for(let i=0;i<points.length;i+=8){const p=points[i];roadSamples.push([p[0],p[1],p[2]])}
 // Edge stripes are batched into line geometry rather than hundreds of meshes.
 if(def.kind!=='gravel'){
  const pos=[];
  for(let i=0;i<points.length-8;i+=18){
   const p=curve.getPoint(i/n),q=curve.getPoint((i+7)/n);pos.push(p.x,p.y+.18,p.z,q.x,q.y+.18,q.z);
  }

 }
}
roads.forEach(drawRoad);
function closestRoad(x,z){

 for(const l of lines)for(let i=1;i<l.pts.length;i++){
  const a=l.pts[i-1],b=l.pts[i],vx=b[0]-a[0],vz=b[1]-a[1],len=vx*vx+vz*vz||1;
  const t=Math.max(0,Math.min(1,((x-a[0])*vx+(z-a[1])*vz)/len));
  const dis=Math.hypot(x-a[0]-t*vx,z-a[1]-t*vz);
  if(dis<best.distance)best={distance:dis,y:a[2]+t*(b[2]-a[2]),kind:l.kind,name:l.name};
 }
 return best;
}
// Actual elevated road needs a visual mountainside beneath it.
// Each slope column is drawn only every 110m to keep the low-poly prototype light.
for(const l of lines.filter(x=>x.kind==='mountain')){
 for(let i=3;i<l.pts.length;i+=10){
  const p=l.pts[i];if(p[2]<12)continue;
  const radius=32+Math.min(90,p[2]*.27);
  cone(p[0],p[2]*.42-3,p[1],radius,p[2]*.91,hillMat,7);
 }
}
const lake=part(new T.CircleGeometry(355,64),waterMat,-800,-1,655);lake.rotation.x=-Math.PI/2;
const sea=part(new T.PlaneGeometry(1550,680),waterMat,-1030,-1,-1570);sea.rotation.x=-Math.PI/2;

 cube(x,h/2,z,22,h,19,m);
 const roof=cone(x,h+5,z,17,10,M(shop?'#d45c61':'#b26c5a'),4);roof.rotation.y=Math.PI/4;

 if(shop)cube(x,h*.73,z+11,16,2.8,2.5,M('#ffcf91'))
}
const colors=['#f4b5a5','#fee3a3','#b5d7ed','#dec0e2','#c4e7b8'];
for(let i=0;i<25;i++){const x=-340+(i%5)*88,z=-1080+Math.floor(i/5)*72;if(closestRoad(x,z).distance<20)continue;building(x,z,colors[i%5],i%3===0)}
for(let i=0;i<10;i++)building(-1100+i%5*80,-460+Math.floor(i/5)*70,colors[(i+2)%5],i%4===0);
for(let i=0;i<8;i++)building(-1240+i*53,-1135,colors[i%5],i%3===0);

// Windmills / farms.
for(const [x,z] of [[-1110,-250],[-1050,-300],[-1360,100]]){

}
// GPU instanced trees: only ~2 draw calls for a broad map, natural scenery without thousands of meshes.
let seed=1982;function rnd(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
const trees=[];for(let i=0;i<850;i++){
 const x=(rnd()-.5)*2950,z=(rnd()-.5)*2950;
 if(closestRoad(x,z).distance<23||Math.hypot(x+800,z-655)<390||z< -1410||x>300&&z>300)continue;

}
const trunkInst=new T.InstancedMesh(new T.CylinderGeometry(.85,.85,5,5),trunkMat,trees.length);
const crownInst=new T.InstancedMesh(new T.ConeGeometry(4.5,11,6),leafMat,trees.length);
const dummy=new T.Object3D();
trees.forEach(([x,z,h],i)=>{dummy.position.set(x,h*.24,z);dummy.scale.set(h/12,h/12,h/12);dummy.updateMatrix();trunkInst.setMatrixAt(i,dummy.matrix);
 dummy.position.y=h*.8;dummy.updateMatrix();crownInst.setMatrixAt(i,dummy.matrix)});
scene.add(trunkInst,crownInst);
// Progressive detail budget: mountain tops and distant windmills are low-poly landmarks.
for(let i=0;i<22;i++){const x=300+i*48,z=1280+(i%4)*32;cone(x,80,z,70+(i%3)*20,165+(i%5)*28,rockMat,6)}
const checkpoints=[
{name:'小镇主街',x:-250,z:-890},{name:'乡村风车',x:-1110,z:-250},{name:'湖边码头',x:-1040,z:480},
{name:'森林营地',x:-400,z:730},{name:'山顶观景台',x:1280,z:1150},{name:'海滨灯塔',x:-1330,z:-940},
{name:'赛车场外圈',x:1050,z:-870},{name:'回到车库',x:-610,z:-1130}
];
const beaconMat=new T.MeshStandardMaterial({color:'#ffe488',emissive:'#f9b840',emissiveIntensity:.4});
const beacons=checkpoints.map((p,i)=>{const y=closestRoad(p.x,p.z).y;const o=part(new T.OctahedronGeometry(5),beaconMat,p.x,y+12,p.z);return o});
const car=new T.Group();scene.add(car);const chassis=new T.Group();car.add(chassis);
function carBox(w,h,d,x,y,z,color){const m=new T.Mesh(geoBox(w,h,d),M(color));m.position.set(x,y,z);chassis.add(m)}
carBox(4.8,1.4,7,0,1.9,0,'#e65b63');carBox(4,1,2.7,0,1.9,-2.3,'#f78c7b');
carBox(3.7,1.5,2.6,0,3.1,1,'#a8e1f8');carBox(4,.3,3,0,3.95,1,'#f4f7ff');
const wheels=[];for(const x of [-2.25,2.25])for(const z of [-2.1,2.35]){
 const wheel=new T.Mesh(new T.CylinderGeometry(1.12,1.12,.7,14),M('#323a40'));
 wheel.rotation.z=Math.PI/2;wheel.position.set(x,1.15,z);chassis.add(wheel);wheels.push(wheel);
}
const state={x:-610,z:-1130,y:1,heading:Math.PI/2,speed:0,steer:0,cam:0,progress:0,driveDistance:0,shake:0,vertical:0,zoom:1};
const buttons={left:false,right:false,gas:false,brake:false};
function reset(){state.x=-610;state.z=-1130;state.heading=Math.PI/2;state.speed=0;state.steer=0;state.progress=0;state.shake=0;state.driveDistance=0}
reset();
for(const el of document.querySelectorAll('[data-key]')){
 const key=el.dataset.key;
 const down=e=>{e.preventDefault();buttons[key]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(_){}};
 const up=e=>{e.preventDefault();buttons[key]=false;el.classList.remove('on')};
 el.addEventListener('pointerdown',down);for(const name of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(name,up)
}
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'gas',KeyW:'gas',ArrowDown:'brake',KeyS:'brake'};
window.addEventListener('keydown',e=>{if(keyMap[e.code]){buttons[keyMap[e.code]]=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{if(keyMap[e.code]){buttons[keyMap[e.code]]=false;e.preventDefault()}});
$('cam').onclick=()=>state.cam=(state.cam+1)%3;$('garage').onclick=()=>{reset();toast('返回车库：探索进度已重新开始')};
$('mapZoom').onclick=()=>{state.zoom=state.zoom===1?1.7:1;mini.style.transform=state.zoom>1?'scale(1.5)':'scale(1)';mini.style.transformOrigin='top right';toast(state.zoom>1?'小地图放大':'小地图恢复')};
let toastTime=0;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');toastTime=performance.now()+2300}
function drive(dt){
 const before=closestRoad(state.x,state.z);
 const accel=buttons.gas?17:0,brake=buttons.brake?26:0;
 state.speed=Math.max(-10,Math.min(30,state.speed+dt*(accel-brake)));
 if(!buttons.gas&&!buttons.brake)state.speed-=Math.sign(state.speed)*Math.min(Math.abs(state.speed),8*dt);
 state.steer=T.MathUtils.damp(state.steer,(buttons.left?1:0)-(buttons.right?1:0),7,dt);
 // Left is left in both touch and keyboard: clockwise heading decreases for left.
 if(Math.abs(state.speed)>.3)state.heading-=state.steer*dt*(.55+Math.min(Math.abs(state.speed),22)*.023)*Math.sign(state.speed);
 const nx=state.x+Math.sin(state.heading)*state.speed*dt,nz=state.z-Math.cos(state.heading)*state.speed*dt;
 if(Math.abs(nx)>=1450||Math.abs(nz)>=1450){state.speed=0}else{state.x=nx;state.z=nz}
 const surface=closestRoad(state.x,state.z);state.driveDistance+=Math.abs(state.speed*dt);
 if(surface.distance>15)state.speed*=Math.pow(.95,dt*60);
 // A visibly elevated 3D road: vehicle follows sampled mountain elevation.
 const targetY=surface.distance<22?surface.y+1.2:Math.max(1.2,surface.y+1.2-(surface.distance-22)*.03);
 state.y=T.MathUtils.damp(state.y,targetY,7,dt);
 const lakeBump=surface.kind==='gravel'&&surface.distance<13;
 const bumpTarget=lakeBump?Math.min(.35,.06+Math.abs(state.speed)*.009)*(
  .6*Math.sin(state.driveDistance*2.7)+.4*Math.sin(state.driveDistance*4.9)) : 0;
 state.shake=T.MathUtils.damp(state.shake,bumpTarget,13,dt);
 state.vertical=T.MathUtils.damp(state.vertical,bumpTarget*.23,4,dt);
 car.position.set(state.x,state.y,state.z);
 car.rotation.set(0,-state.heading,0);
 chassis.position.y=state.shake;
 chassis.rotation.z=lakeBump?Math.sin(state.driveDistance*2.15)*.018:0;
 chassis.rotation.x=lakeBump?Math.sin(state.driveDistance*3.1)*.014:0;
 wheels.forEach(w=>{w.rotation.x+=state.speed*dt/1.12});
 const cp=checkpoints[state.progress];if(cp&&Math.hypot(state.x-cp.x,state.z-cp.z)<32){
  state.progress++;toast(state.progress===checkpoints.length?'🎉 环游完成！还可以自由探索其他岔路':'⭐ 到达 '+cp.name+'！');
 }
}
function cameraUpdate(dt){
 const f=new T.Vector3(Math.sin(state.heading),0,-Math.cos(state.heading)),s=new T.Vector3(Math.cos(state.heading),0,Math.sin(state.heading));
 const pos=new T.Vector3(state.x,state.y,state.z),look=pos.clone();
 if(state.cam===0){pos.addScaledVector(f,-23).y+=15;look.addScaledVector(f,13).y+=3.2}
 else if(state.cam===1){pos.addScaledVector(f,15).addScaledVector(s,17).y+=10;look.y+=3}
 else {pos.y+=78;look.addScaledVector(f,7)}
 // Camera bump is deliberately much weaker than car suspension to avoid motion sickness.

}
const mini=$('map'),ctx=mini.getContext('2d');function dot(x,z){return [(x+1500)/3000*mini.width,(1500-z)/3000*mini.height]}

 ctx.fillStyle='#73cee3';let p=dot(-800,655);ctx.beginPath();ctx.arc(...p,26,0,7);ctx.fill();

 p=dot(state.x,state.z);ctx.fillStyle='#e64d60';ctx.beginPath();ctx.arc(...p,5,0,7);ctx.fill();
}
let frame=0,last=performance.now();
const beaconBase=checkpoints.map(p=>closestRoad(p.x,p.z).y+12);function animate(now){
 const dt=Math.min(.05,Math.max(.001,(now-last)/1000));last=now;
 drive(dt);cameraUpdate(dt);
 for(let i=0;i<beacons.length;i++){beacons[i].rotation.y+=dt*.7;beacons[i].position.y=beaconBase[i]+Math.sin(now*.001+i)*.8}
 if(now>toastTime)$('toast').classList.remove('show');
 if(frame++%7===0){
  const near=closestRoad(state.x,state.z);
  $('telemetry').textContent='速度 '+Math.round(Math.abs(state.speed)*3.6)+' km/h · 海拔 '+Math.round(state.y-1)+' m';
  $('region').textContent=near.kind==='mountain'?'⛰ '+near.name:near.kind==='gravel'?'🪨 湖畔颠簸碎石路':near.distance<24?'🛣 '+near.name:'🌿 自由越野区域';
  const cp=checkpoints[state.progress];$('task').textContent=cp?'下一站：'+cp.name+' · '+Math.round(Math.hypot(state.x-cp.x,state.z-cp.z))+'m':'✅ 已环游完成，继续兜风';
  mapRender()
 }
 renderer.render(scene,camera);requestAnimationFrame(animate)
}
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
state.zoom=1;$('loading').style.display='none';toast('3 × 3 公里大地图 · 跟随导航，也可自由岔路探索');requestAnimationFrame(animate);
</script></body></html>
