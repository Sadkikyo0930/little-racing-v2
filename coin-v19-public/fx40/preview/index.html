<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>金色猛虎 · 骨骼动画预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1522;color:#e8f2fc;font:15px system-ui}
main{width:min(1040px,100%);margin:auto;padding:clamp(10px,2vw,24px)}
canvas{width:100%;height:auto;display:block;border-radius:16px;background:#111e2e;touch-action:none}
nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
button,a{font:inherit;color:#e9f3fc;background:#23364f;border:1px solid #6e879d;border-radius:9px;min-height:44px;padding:10px}
button[aria-pressed="true"]{color:#301b08;background:#f7ba61}input{flex:1;min-width:120px}output{min-width:7ch}
</style><main>
<canvas width="840" height="390" aria-label="金色猛虎骨骼动画"></canvas>
<nav><button id="replay">重播扑击</button><button id="freeze" aria-pressed="false">暂停</button>
<button id="slow" aria-pressed="false">慢放</button><button id="angle">切换视角</button>
<input id="time" aria-label="动画时间" type="range" min="0" max="1.50" step=".01" value="0">
<output id="status">加载模型</output><a href="../?fx-review=1&amp;fx=v4">赛道验收</a></nav>
</main><script type="module" src="./tiger-preview.mjs"></script></html>
